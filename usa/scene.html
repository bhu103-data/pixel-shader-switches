<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Animated fullscreen pixel panoramas of New York, Alaska, and Las Vegas.">
<title>Explore the Maps | Pixel Atlas</title>
<link rel="stylesheet" href="style.css">
<script src="atlas.js?v=vegas-jackpot" defer></script>
</head>
<body>
<main id="stage" aria-label="Fullscreen pixel panorama">
  <div class="world" role="img" id="landscape">
    <canvas id="twilight" width="640" height="288"></canvas>
    <canvas id="night" width="640" height="288"></canvas>
  </div>
  <div class="top">
    <nav aria-label="Regions">
      <button data-region="ny" aria-pressed="true">New York</button>
      <button data-region="ak" aria-pressed="false">Alaska</button>
      <button data-region="lv" aria-pressed="false">Las Vegas</button>
    </nav>
    <div class="top-actions"><a href="./index.html" class="account-link">Account</a><button id="fullscreen" aria-pressed="false">Fullscreen</button></div>
  </div>
  <section class="bottom" aria-label="Scene controls">
    <div class="caption"><h1 id="landmark">New York</h1><p id="alert" role="status"></p></div>
    <div class="controls">
      <label for="light">Dawn <input id="light" type="range" min="0" max="100" value="0" aria-label="Time of day"> Next dawn</label>
      <label for="season">Season
        <select id="season"><option value="0">Spring</option><option value="1">Summer</option><option value="2">Fall</option><option value="3">Winter</option></select>
      </label>
      <button id="cycle" aria-pressed="true">Auto cycle</button>
      <button id="motion" aria-pressed="false">Pause</button>
    </div>
  </section>
</main>
</body>
</html>
