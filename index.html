<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Tactile Pixel &amp; Light Shader Switches</title>
<style>
  :root {
    --stage-bg: #eef0f2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #e9e9e9;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    user-select: none; -webkit-user-select: none;
  }

  /* 16:9 Stage */
  #stage {
    position: relative;
    width: min(100vw, calc(100dvh * 16 / 9));
    height: min(100dvh, calc(100vw * 9 / 16));
    background: var(--stage-bg);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    box-shadow: 0 24px 70px rgba(0,0,0,0.12);
    transition: background-color 0.06s linear;
  }

  /* Subtle floating mode selector (auto-dims, press H to toggle completely) */
  #navBar {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    z-index: 40; display: flex; gap: 6px; padding: 4px;
    background: rgba(20, 22, 32, 0.72); backdrop-filter: blur(8px);
    border-radius: 999px; border: 1px solid rgba(255,255,255,0.14);
    opacity: 0.35; transition: opacity 0.25s ease;
  }
  #navBar:hover { opacity: 1; }
  @media (hover: none) {
    #navBar { opacity: 0.82; max-width: 94vw; overflow-x: auto; }
    .nav-pill { padding: 7px 12px; font-size: 13px; }
  }
  #navBar.hidden { display: none; }
  .usa-link {
    position: absolute; z-index: 39; right: 12px; bottom: 12px;
    padding: 6px 11px; border-radius: 999px; background: #202434;
    color: #fff; text-decoration: none; font-size: 13px;
  }
  .usa-link:focus-visible { outline: 2px solid #ffa84e; outline-offset: 3px; }
  .nav-pill {
    border: none; background: transparent; color: rgba(255,255,255,0.78);
    font-size: 12px; padding: 5px 12px; border-radius: 999px; cursor: pointer;
    transition: all 0.2s ease; white-space: nowrap;
  }
  .nav-pill:hover { color: #fff; background: rgba(255,255,255,0.12); }
  .nav-pill.active { background: #fff; color: #161822; font-weight: 600; }

  .scene-panel {
    position: absolute; inset: 0;
    display: none; align-items: center; justify-content: center;
  }
  .scene-panel.active { display: flex; }

  /* Scene 1: Lujiazui Focus Switch (60% stage width, aspect 1.6439) */
  #lujiazuiWrap {
    position: relative;
    width: 60%;
    aspect-ratio: 1.6439;
    display: flex; align-items: center; justify-content: center;
  }
  #lujiazuiGL, #lujiazui2D {
    position: absolute; inset: 0; width: 100%; height: 100%; display: block;
  }
  #lujiazui2D { display: none; }
  #lujiazuiBtn {
    position: absolute;
    width: 85.4%; height: 75.76%;
    border: none; background: transparent; cursor: grab;
    border-radius: 999px; z-index: 10; outline: none;
    touch-action: none;
  }
  #lujiazuiBtn:active { cursor: grabbing; }
  #lujiazuiBtn:focus-visible { box-shadow: 0 0 0 3px rgba(239, 160, 44, 0.65); }

  /* Scene 2: Beijing Four Seasons Scroll Switch (84% stage width, aspect 3.2) */
  #beijingWrap {
    position: relative;
    width: 84%;
    aspect-ratio: 3.2;
    display: flex; align-items: center; justify-content: center;
  }
  @media (max-width: 700px) {
    #beijingWrap { width: 96%; }
  }
  #beijingGL, #beijing2D {
    position: absolute; inset: 0; width: 100%; height: 100%; display: block;
  }
  #beijing2D { display: none; }
  #sealCanvas {
    position: absolute;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    pointer-events: none;
    z-index: 2;
  }
  #beijingSlider {
    position: absolute;
    width: 90%; height: 72%;
    border-radius: 999px;
    cursor: grab; z-index: 10; outline: none;
    touch-action: none;
  }
  #beijingSlider:active { cursor: grabbing; }
  #beijingSlider:focus-visible { box-shadow: 0 0 0 3px rgba(168, 50, 45, 0.65); }

  /* Scene 3: Light & Dark Switch (440x280 container) */
  #lightDarkWrap {
    position: relative;
    width: min(440px, 92%);
    aspect-ratio: 440 / 280;
    display: flex; align-items: center; justify-content: center;
  }
  #ldCanvas {
    width: 100%; height: 100%; display: block;
  }
  #ldBtn {
    position: absolute;
    left: 13.64%; top: 20.71%; width: 72.73%; height: 58.57%;
    border-radius: 999px; border: none; background: transparent;
    cursor: pointer; z-index: 10; outline: none;
    touch-action: none;
  }
  #ldBtn:focus-visible { box-shadow: 0 0 0 3px rgba(142, 155, 255, 0.7); }

  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap;
  }
</style>
</head>
<body>
<div id="stage">
  <a class="usa-link" href="./usa/">Explore Pixel Atlas</a>
  <div id="navBar" title="按 H 键可隐藏切换栏">
    <button class="nav-pill active" data-tab="lujiazui">01 · 陆家嘴专注开关</button>
    <button class="nav-pill" data-tab="beijing">02 · 北京四季卷轴</button>
    <button class="nav-pill" data-tab="lightdark">03 · 光明与黑暗</button>
    <button class="nav-pill" id="hideNavBtn" title="隐藏顶部栏">✕</button>
  </div>

  <!-- 1. Lujiazui 52F Focus Switch -->
  <div id="panel-lujiazui" class="scene-panel active">
    <div id="lujiazuiWrap">
      <canvas id="lujiazuiGL"></canvas>
      <canvas id="lujiazui2D"></canvas>
      <button id="lujiazuiBtn" role="switch" aria-checked="false" aria-label="专注模式"></button>
    </div>
  </div>

  <!-- 2. Beijing Four Seasons Scroll Switch -->
  <div id="panel-beijing" class="scene-panel">
    <div id="beijingWrap">
      <canvas id="sealCanvas"></canvas>
      <canvas id="beijingGL"></canvas>
      <canvas id="beijing2D"></canvas>
      <div id="beijingSlider" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0" aria-valuetext="春 · 长城 · 清晨" aria-label="北京四季卷轴"></div>
    </div>
  </div>

  <!-- 3. Light & Dark Switch -->
  <div id="panel-lightdark" class="scene-panel">
    <div id="lightDarkWrap">
      <canvas id="ldCanvas" width="440" height="280"></canvas>
      <button id="ldBtn" role="switch" aria-checked="false" aria-label="浅色模式"></button>
    </div>
  </div>

  <div id="liveRegion" class="sr-only" aria-live="polite"></div>
</div>

<script>
(() => {
  'use strict';

  const stage = document.getElementById('stage');
  const liveRegion = document.getElementById('liveRegion');
  const reducedMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  let reducedMotion = reducedMotionQuery.matches;
  reducedMotionQuery.addEventListener('change', e => { reducedMotion = e.matches; });

  function announce(txt) {
    liveRegion.textContent = '';
    requestAnimationFrame(() => { liveRegion.textContent = txt; });
  }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function smoothstep(e0, e1, x) {
    const t = clamp((x - e0) / (e1 - e0), 0, 1);
    return t * t * (3 - 2 * t);
  }
  function roundRectPath(ctx, x, y, width, height, radius) {
    const r = Math.min(radius, width * 0.5, height * 0.5);
    ctx.beginPath();
    if (typeof ctx.roundRect === 'function') {
      ctx.roundRect(x, y, width, height, r);
      return;
    }
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + width, y, x + width, y + height, r);
    ctx.arcTo(x + width, y + height, x, y + height, r);
    ctx.arcTo(x, y + height, x, y, r);
    ctx.arcTo(x, y, x + width, y, r);
    ctx.closePath();
  }

  // =========================================================================
  // OKLab Color Space & Gamut-Clamped Palette Quantization
  // =========================================================================
  function srgbToLinear(c) {
    return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  }
  function linearToSrgb(c) {
    c = clamp(c, 0, 1);
    return c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
  }
  function hexToRgb01(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
  }
  function rgbToOklab(r, g, b) {
    const lr = srgbToLinear(r), lg = srgbToLinear(g), lb = srgbToLinear(b);
    const l = 0.4122214708 * lr + 0.5363325363 * lg + 0.0514459929 * lb;
    const m = 0.2119034982 * lr + 0.6806995451 * lg + 0.1073969566 * lb;
    const s = 0.0883024619 * lr + 0.2817188376 * lg + 0.6299787005 * lb;
    const l_ = Math.cbrt(l), m_ = Math.cbrt(m), s_ = Math.cbrt(s);
    return [
      0.2104542553 * l_ + 0.7936177850 * m_ - 0.0040720468 * s_,
      1.9779984951 * l_ - 2.4285922050 * m_ + 0.4505937099 * s_,
      0.0259040371 * l_ + 0.7827717662 * m_ - 0.8086757660 * s_
    ];
  }
  function oklabToLinearRgb(L, a, b) {
    const l_ = L + 0.3963377774 * a + 0.2158037573 * b;
    const m_ = L - 0.1055613458 * a - 0.0638541728 * b;
    const s_ = L - 0.0894841775 * a - 1.2914855480 * b;
    const l = l_ * l_ * l_, m = m_ * m_ * m_, s = s_ * s_ * s_;
    return [
      +4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
      -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
      -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s
    ];
  }
  function oklabGamutSrgb(L, a, b) {
    let scale = 1.0;
    let lin = oklabToLinearRgb(L, a, b);
    while ((lin[0] < -1e-4 || lin[0] > 1.0001 || lin[1] < -1e-4 || lin[1] > 1.0001 || lin[2] < -1e-4 || lin[2] > 1.0001) && scale > 0.01) {
      scale *= 0.94;
      lin = oklabToLinearRgb(L, a * scale, b * scale);
    }
    return [linearToSrgb(lin[0]), linearToSrgb(lin[1]), linearToSrgb(lin[2])];
  }
  function mixOklabHex(hex1, hex2, t) {
    const c1 = rgbToOklab(...hexToRgb01(hex1));
    const c2 = rgbToOklab(...hexToRgb01(hex2));
    const rgb = oklabGamutSrgb(lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t));
    return `rgb(${Math.round(rgb[0]*255)}, ${Math.round(rgb[1]*255)}, ${Math.round(rgb[2]*255)})`;
  }

  // 4x4 Bayer Matrix
  const BAYER4 = new Uint8Array([
     0,  8,  2, 10,
    12,  4, 14,  6,
     3, 11,  1,  9,
    15,  7, 13,  5
  ]);

  // =========================================================================
  // Shared WebGL2 Liquid-Glass Capsule + Light-Field Compositor
  // =========================================================================
  const COMP_VS = `#version 300 es
    layout(location=0) in vec2 aPos;
    out vec2 vUv;
    void main() {
      vUv = aPos * 0.5 + 0.5;
      gl_Position = vec4(aPos, 0.0, 1.0);
    }
  `;

  const COMP_FS = `#version 300 es
    precision highp float;
    in vec2 vUv;
    out vec4 fragColor;

    uniform sampler2D uWorldTex;
    uniform sampler2D uLightTex;
    uniform sampler2D uSurfTex; // 48x48 lens surface attachment (Beijing)
    uniform float uHasSurf;

    uniform vec2 uCompSize;     // CSS/device pixels of component canvas
    uniform vec2 uCapCenter;    // Center of capsule in canvas pixels
    uniform vec2 uCapSize;      // Width, Height of capsule in canvas pixels
    uniform float uShellThick;  // Shell thickness in pixels
    uniform float uLensX;       // Lens center X in canvas pixels
    uniform float uLensRad;     // Lens radius in pixels
    uniform vec2 uLensStretch;  // (sx, sy)
    uniform float uPress;       // 0..1 pressed state
    uniform float uDispersion;  // Chromatic dispersion ~0.05
    uniform float uNight;       // 0..1 darkness
    uniform vec3 uShellDayCol;
    uniform vec3 uShellNightCol;
    uniform vec3 uWarmGlowCol;  // Leak glow outside capsule
    uniform float uWarmGlowAmt;
    uniform vec2 uWarmCentroid; // Normalized 0..1 in window
    uniform float uFlash;       // Lightning flash 0..1
    uniform float uK;           // Integer pixel scale k
    uniform vec2 uWinTopLeft;   // Window inner top-left in canvas pixels
    uniform vec2 uWinSize;      // Window inner width, height in canvas pixels
    uniform vec2 uPad;          // Overscan padding in world pixels (14,14) or (16,16)
    uniform vec2 uWorldTexSize; // Full pixel world dimensions (including overscan)
    uniform float uTime;

    float sdCapsule(vec2 p, vec2 b) {
      float r = b.y * 0.5;
      vec2 q = abs(p) - vec2(b.x * 0.5 - r, 0.0);
      return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
    }

    // B-spline smooth sampling for light field
    vec4 sampleLightBSpline(vec2 uv) {
      vec2 res = vec2(textureSize(uLightTex, 0));
      vec2 p = uv * res - 0.5;
      vec2 i = floor(p);
      vec2 f = fract(p);
      vec2 f2 = f * f;
      vec2 f3 = f2 * f;
      vec2 w0 = (1.0 - f) * (1.0 - f) * (1.0 - f) / 6.0;
      vec2 w1 = (3.0 * f3 - 6.0 * f2 + 4.0) / 6.0;
      vec2 w2 = (-3.0 * f3 + 3.0 * f2 + 3.0 * f + 1.0) / 6.0;
      vec2 w3 = f3 / 6.0;
      vec2 s0 = w0 + w1;
      vec2 s1 = w2 + w3;
      vec2 t0 = (i - 1.0 + w1 / s0 + 0.5) / res;
      vec2 t1 = (i + 1.0 + w3 / s1 + 0.5) / res;
      return (texture(uLightTex, vec2(t0.x, t0.y)) * s0.x + texture(uLightTex, vec2(t1.x, t0.y)) * s1.x) * s0.y +
             (texture(uLightTex, vec2(t0.x, t1.y)) * s0.x + texture(uLightTex, vec2(t1.x, t1.y)) * s1.x) * s1.y;
    }

    // Nearest-neighbor integer-scaled pixel world lookup
    vec3 samplePixelWorld(vec2 winPx) {
      vec2 worldCoord = floor(winPx / uK) + uPad;
      vec2 uv = (worldCoord + 0.5) / uWorldTexSize;
      return texture(uWorldTex, uv).rgb;
    }

    float hash12(vec2 p) {
      vec3 p3 = fract(vec3(p.xyx) * 0.1031);
      p3 += dot(p3, p3.yzx + 33.33);
      return fract((p3.x + p3.y) * p3.z);
    }

    void main() {
      vec2 fragPx = vec2(vUv.x * uCompSize.x, (1.0 - vUv.y) * uCompSize.y);
      vec2 relCap = fragPx - uCapCenter;
      float dOuter = sdCapsule(relCap, uCapSize);
      vec2 innerSize = uCapSize - vec2(uShellThick * 2.0);
      float dInner = sdCapsule(relCap, innerSize);

      // 1. Exterior background: two soft shadows + warm light leak + lightning
      vec4 outCol = vec4(0.0);
      if (dOuter > 0.0) {
        float shBig = exp(-max(0.0, dOuter - 2.0) * 0.055) * 0.22;
        float shSmall = exp(-max(0.0, dOuter) * 0.22) * 0.28;
        float shadowAlpha = clamp(shBig + shSmall, 0.0, 0.55);

        // Warm light leaking out from capsule
        vec2 winNorm = clamp((fragPx - uWinTopLeft) / uWinSize, 0.0, 1.0);
        float leakFalloff = exp(-dOuter * 0.032) * uWarmGlowAmt;
        float centroidBoost = 0.65 + 0.55 * exp(-length(winNorm - uWarmCentroid) * 2.4);
        vec3 glow = uWarmGlowCol * leakFalloff * centroidBoost * 0.55;
        glow += vec3(0.85, 0.92, 1.0) * exp(-dOuter * 0.025) * uFlash * 0.65;

        outCol = vec4(glow - vec3(shadowAlpha * 0.35), clamp(shadowAlpha + length(glow) * 0.6, 0.0, 1.0));
      }

      // 2. Polished Rounded Thick Outer Shell
      if (dOuter <= 0.0 && dInner > 0.0) {
        float t = clamp(-dOuter / uShellThick, 0.0, 1.0); // 0 at outer edge, 1 at inner window edge
        // Approximate outward capsule normal
        float eps = 1.5;
        vec2 grad = normalize(vec2(
          sdCapsule(relCap + vec2(eps, 0.0), uCapSize) - sdCapsule(relCap - vec2(eps, 0.0), uCapSize),
          sdCapsule(relCap + vec2(0.0, eps), uCapSize) - sdCapsule(relCap - vec2(0.0, eps), uCapSize)
        ) + 1e-5);

        // Curved normal across shell thickness
        float bend = (t - 0.48) * 2.1;
        vec3 n = normalize(vec3(grad * bend, sqrt(max(0.05, 1.0 - clamp(bend * bend, 0.0, 0.92)))));
        vec3 viewDir = vec3(0.0, 0.0, 1.0);
        float fresnel = pow(1.0 - max(dot(n, viewDir), 0.0), 2.6);

        // Studio reflection: large softbox top-left, subtle fill bottom
        vec3 refl = reflect(-viewDir, n);
        float topLeftSoftbox = smoothstep(0.15, 0.85, dot(refl, normalize(vec3(-0.62, -0.68, 0.38))));
        float bottomFill = smoothstep(0.25, 0.9, dot(refl, normalize(vec3(0.0, 0.88, 0.45))));

        vec3 baseShell = mix(uShellDayCol, uShellNightCol, uNight);
        // Darken inner side for recessed window bezel feel
        float innerRecess = smoothstep(0.68, 1.0, t);
        baseShell *= (1.0 - innerRecess * 0.34);

        // Warm lamp/lantern bounce onto shell
        vec2 shellWinUv = clamp((fragPx - uWinTopLeft) / uWinSize, 0.0, 1.0);
        float lampProx = exp(-length(shellWinUv - uWarmCentroid) * 2.8) * uWarmGlowAmt;
        baseShell += uWarmGlowCol * lampProx * 0.24;

        vec3 shellCol = baseShell;
        shellCol += vec3(1.0, 0.99, 0.97) * topLeftSoftbox * (0.28 + fresnel * 0.42);
        shellCol += vec3(0.85, 0.88, 0.95) * bottomFill * (0.08 + fresnel * 0.14);
        shellCol += vec3(0.95, 0.97, 1.0) * uFlash * 0.35;

        // Anti-aliased outer edge
        float edgeAA = smoothstep(0.0, -1.2, dOuter);
        outCol = mix(outCol, vec4(clamp(shellCol, 0.0, 1.0), 1.0), edgeAA);
      }

      // 3. Recessed Window & Liquid-Glass Lens
      if (dInner <= 0.0) {
        vec2 winPx = fragPx - uWinTopLeft;
        vec2 winUv = winPx / uWinSize;

        // Base pixel world inside window
        vec3 worldCol = samplePixelWorld(winPx);
        vec3 lightGlow = sampleLightBSpline(winUv).rgb;
        // Screen blend light field
        worldCol = 1.0 - (1.0 - worldCol) * (1.0 - lightGlow * 0.62);

        // Recessed window top inner shadow, perimeter dark rim, and faint diagonal glass highlight
        float rimShadow = exp(dInner * 0.22) * 0.34;
        float topDrop = smoothstep(26.0, 0.0, winPx.y) * 0.24;
        float diagGlint = smoothstep(0.38, 0.52, (winUv.x * 0.65 + (1.0 - winUv.y) * 0.35)) *
                          (1.0 - smoothstep(0.52, 0.68, (winUv.x * 0.65 + (1.0 - winUv.y) * 0.35)));
        worldCol *= (1.0 - rimShadow - topDrop);
        worldCol += vec3(1.0) * diagGlint * 0.055;

        // Liquid-Glass Lens evaluation
        vec2 lensCenter = vec2(uLensX, uCapCenter.y);
        vec2 pLens = (fragPx - lensCenter) / uLensStretch;
        float r = length(pLens) / uLensRad;

        // Cast shadow from lens onto pixel world below/right
        vec2 shadowOffset = vec2(3.5 + uPress * 3.5, 6.0 + uPress * 5.0);
        float rShad = length((fragPx - (lensCenter + shadowOffset)) / uLensStretch) / uLensRad;
        float lensCastShadow = (1.0 - smoothstep(0.84, 1.14, rShad)) * (0.28 + uPress * 0.16);
        worldCol *= (1.0 - lensCastShadow);

        if (r <= 1.0) {
          // Flat center (0..0.70) magnifying 1.24x; outer 30% (0.70..1.0) bends rapidly to compress outside world
          float magCenter = 1.0 / 1.24;
          float outerT = clamp((r - 0.70) / 0.30, 0.0, 1.0);
          float bendCurve = outerT * outerT * (3.0 - 2.0 * outerT);
          float radialScale = mix(magCenter, 1.38, bendCurve);

          vec2 dir = r > 1e-4 ? pLens / length(pLens) : vec2(0.0);
          float disp = uDispersion * bendCurve;

          vec2 samplePtR = (lensCenter + pLens * radialScale * (1.0 + disp)) - uWinTopLeft;
          vec2 samplePtG = (lensCenter + pLens * radialScale) - uWinTopLeft;
          vec2 samplePtB = (lensCenter + pLens * radialScale * (1.0 - disp)) - uWinTopLeft;

          vec3 refrCol;
          refrCol.r = samplePixelWorld(samplePtR).r;
          refrCol.g = samplePixelWorld(samplePtG).g;
          refrCol.b = samplePixelWorld(samplePtB).b;

          // Screen-blend light field inside lens
          vec2 refrUv = clamp(samplePtG / uWinSize, 0.0, 1.0);
          vec3 refrLight = sampleLightBSpline(refrUv).rgb;
          refrCol = 1.0 - (1.0 - refrCol) * (1.0 - refrLight * 0.68);

          // Overlay crisp 48x48 pixel surface attachment (no refraction)
          if (uHasSurf > 0.5) {
            vec2 surfTexel = floor((pLens / uLensRad * 0.5 + 0.5) * 48.0);
            if (surfTexel.x >= 0.0 && surfTexel.x < 48.0 && surfTexel.y >= 0.0 && surfTexel.y < 48.0) {
              vec4 surfSample = texture(uSurfTex, (surfTexel + 0.5) / 48.0);
              refrCol = mix(refrCol, surfSample.rgb, surfSample.a);
            }
          }

          // Caustic light concentration along lower inner rim
          float lowerRim = smoothstep(0.68, 0.93, r) * (1.0 - smoothstep(0.93, 1.0, r)) * smoothstep(0.15, 0.95, dir.y);
          refrCol += mix(vec3(1.0, 0.96, 0.88), uWarmGlowCol + 0.35, uWarmGlowAmt) * lowerRim * 0.42;

          // Soft specular reflection at top of lens
          vec2 specCenter = vec2(-0.18, -0.46);

  function buildCompositor(canvas) {
    const gl = canvas.getContext('webgl2', { alpha: true, premultipliedAlpha: false, antialias: false });

      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(s));

      }

    const vs = makeShader(gl.VERTEX_SHADER, COMP_VS);
    const fs = makeShader(gl.FRAGMENT_SHADER, COMP_FS);
    if (!vs || !fs) return null;

    gl.attachShader(prog, vs);

    gl.bindVertexArray(vao);

      gl.bindTexture(gl.TEXTURE_2D, t);

      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      return t;
    }

    const worldTex = createTex(gl.NEAREST);
    const lightTex = createTex(gl.LINEAR);
    const surfTex = createTex(gl.NEAREST);

    const locs = {};

      'uWorldTex','uLightTex','uSurfTex','uHasSurf','uCompSize','uCapCenter','uCapSize',
      'uShellThick','uLensX','uLensRad','uLensStretch','uPress','uDispersion','uNight',
      'uShellDayCol','uShellNightCol','uWarmGlowCol','uWarmGlowAmt','uWarmCentroid',
      'uFlash','uK','uWinTopLeft','uWinSize','uPad','uWorldTexSize','uTime'
    ].forEach(name => { locs[name] = gl.getUniformLocation(prog, name); });

  // Light Field 2-pass radius-1 + 2-pass radius-3 * 0.55 box blur
  const lightScratchCache = new Map();
  function buildLightField(srcGrid, cols, rows, dstRgba) {
    const len = cols * rows * 3;
    let scratch = lightScratchCache.get(len);
    if (!scratch) {
      scratch = {
        tempA: new Float32Array(len), tempB: new Float32Array(len),
        blur1: new Float32Array(len), blur3: new Float32Array(len)
      };
      lightScratchCache.set(len, scratch);
    }
    const { tempA, tempB, blur1, blur3 } = scratch;
    blur1.set(srcGrid);
    blur3.set(srcGrid);

    function boxPass(input, output, rad) {
      // Horizontal
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          let r = 0, g = 0, b = 0, cnt = 0;
          for (let dx = -rad; dx <= rad; dx++) {
            const nx = clamp(x + dx, 0, cols - 1);
            const idx = (y * cols + nx) * 3;
            r += input[idx]; g += input[idx+1]; b += input[idx+2]; cnt++;
          }
          const o = (y * cols + x) * 3;
          tempA[o] = r / cnt; tempA[o+1] = g / cnt; tempA[o+2] = b / cnt;
        }
      }
      // Vertical
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          let r = 0, g = 0, b = 0, cnt = 0;
          for (let dy = -rad; dy <= rad; dy++) {
            const ny = clamp(y + dy, 0, rows - 1);
            const idx = (ny * cols + x) * 3;
            r += tempA[idx]; g += tempA[idx+1]; b += tempA[idx+2]; cnt++;
          }
          const o = (y * cols + x) * 3;
          output[o] = r / cnt; output[o+1] = g / cnt; output[o+2] = b / cnt;
        }
      }
    }

    boxPass(blur1, tempB, 1);
    boxPass(tempB, blur1, 1);

    boxPass(blur3, tempB, 3);
    boxPass(tempB, blur3, 3);

    for (let i = 0; i < cols * rows; i++) {
      const s = i * 3, d = i * 4;
      dstRgba[d + 0] = clamp(Math.round((blur1[s + 0] + blur3[s + 0] * 0.55) * 255), 0, 255);
      dstRgba[d + 1] = clamp(Math.round((blur1[s + 1] + blur3[s + 1] * 0.55) * 255), 0, 255);
      dstRgba[d + 2] = clamp(Math.round((blur1[s + 2] + blur3[s + 2] * 0.55) * 255), 0, 255);
      dstRgba[d + 3] = 255;
    }
  }

        if (isReturn && h <= 1.3) {
          fillRect(wx - 6, wy - 3, 2, 12, IDX.bg[3]);
          fillRect(wx + 6, wy - 3, 2, 12, IDX.bg[3]);
        } else {
          // Typing elbows alternating slightly
          const elbowShift = (isCodeMode && !reducedMotion) ? (Math.floor(simTime * 10) % 2) : 0;
          fillRect(wx - 6, wy + 14 + elbowShift, 2, 5, IDX.bg[3]);
          fillRect(wx + 6, wy + 14 + (1 - elbowShift), 2, 5, IDX.bg[3]);
        }
      }

      // 6. Message Bubbles (12..14 open, 15.2+ hits frosted glass, 7.7+ morning backlog flood)
      const glassClosed = (!isReturn && h >= 15.3) || (isReturn && h < 7.4);
      const stopNewBubbles = (!isReturn && h >= 21.5);

      if (!isReturn && h < 15.2) {
        nextBubbleTimer -= dt;
        if (nextBubbleTimer <= 0) {
          nextBubbleTimer = 1.5 + Math.random() * 1.1;
          const fromNeighbor = Math.random() < 0.3;
          bubbles.push({
            sx: fromNeighbor ? (45 + Math.floor(Math.random() * 14)) : 22,
            sy: fromNeighbor ? (25 + Math.floor(Math.random() * 30)) : 38,
            t: 0,
            dotCol: [IDX.surface[2], IDX.muted[2], IDX.neon[1]][Math.floor(Math.random() * 3)],
            squashed: false,
            squashY: 0,
            alpha: 1.0
          });
        }
      } else if (glassClosed && !stopNewBubbles && !isReturn) {
        nextBubbleTimer -= dt;
        if (nextBubbleTimer <= 0) {
          nextBubbleTimer = 2.1 + Math.random() * 1.2;
          bubbles.push({
            sx: 22, sy: 38, t: 0,
            dotCol: [IDX.surface[2], IDX.muted[2], IDX.neon[1]][Math.floor(Math.random() * 3)],
            squashed: false, squashY: 0, alpha: 1.0
          });
        }
      } else if (isReturn && h >= 7.7 && backlogCount > 0) {
        backlogDrainTimer -= dt;
        if (backlogDrainTimer <= 0) {
          backlogDrainTimer = 0.14;
          backlogCount--;
          bubbles.push({
            sx: 22, sy: 38, t: 0.25,
            dotCol: [IDX.surface[2], IDX.muted[2], IDX.neon[1]][backlogCount % 3],
            squashed: false, squashY: 0, alpha: 1.0
          });
        }
      }

      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        if (!b.squashed) {
          b.t += dt * 1.15;
          const bx = Math.round(lerp(b.sx, 74, b.t));
          const arc = Math.sin(b.t * Math.PI) * 14;
          const by = Math.round(lerp(b.sy, 68, b.t) - arc);

          if (glassClosed && bx >= 58 && by >= frostTopY) {
            b.squashed = true;
            b.squashY = by;
            backlogCount = Math.max(4, backlogCount + 1);
            setPx(59, by, IDX.bg[3]); // Impact flash
          } else if (b.t >= 1.0) {
            phoneFlash = 0.45;
            phoneBadge = true;
            bubbles.splice(i, 1);
            continue;
          } else {
            const sz = b.t < 0.2 ? 1 : (b.t < 0.4 ? 3 : 5);
            const sh = sz === 5 ? 4 : sz;
            fillRect(bx, by, sz, sh, IDX.bg[3]);
            if (sz >= 3) setPx(bx + sz - 1, by, b.dotCol);
          }
        } else {
          b.squashY += dt * 7.0;
          b.alpha -= dt * 0.85;
          if (b.alpha <= 0 || b.squashY > 92) {
            bubbles.splice(i, 1);
            continue;
          }
          if (BAYER4[(Math.round(b.squashY) & 3) * 4] < b.alpha * 16) {
            fillRect(58, Math.round(b.squashY), 2, 5, IDX.bg[3]);
          }
        }
      }

      // 7. Sunlight Dust Motes (Daytime)
      if (!reducedMotion && nightAmt < 0.25) {
        for (const d of dusts) {
          const dx = Math.round(d.x + Math.sin(simTime * 0.8 + d.ph) * 2);
          const dy = Math.round(d.y + Math.cos(simTime * 0.6 + d.ph) * 2);
          if (dx > 12 && dx < 62 && dy > 12 && dy < 90) {
            setPx(dx, dy, IDX.bg[3]);
          }
        }
      }

      // 8. Out-of-focus foreground "Boss" silhouette passing quickly when dragged too fast
      if (!reducedMotion && bossPassTimer > 0) {
        const prog = 1.0 - bossPassTimer / 0.5;
        const bx = Math.round(lerp(-35, CORE_W + 15, prog));
        for (let y = 78; y < CORE_H; y++) {
          const shoulder = Math.abs(y - 95) * 0.5;
          for (let xw = bx + Math.round(shoulder); xw < bx + 34 - Math.round(shoulder); xw++) {
            if (BAYER4[(y & 3) * 4 + (xw & 3)] < 8) {
              setPx(xw, y, IDX.fg[0]);
            }
          }
        }
      }

      // Convert index buffer to RGBA
      for (let i = 0; i < FULL_W * FULL_H; i++) {
        const rgb = PAL[idxBuf[i]];
        const o = i * 4;
        rgbaBuf[o] = rgb[0];
        rgbaBuf[o + 1] = rgb[1];
        rgbaBuf[o + 2] = rgb[2];
        rgbaBuf[o + 3] = 255;
      }

      buildLightField(emitGrid, 72, 42, lightRgba);
      return { nightAmt, lampOn };
    }

    // Input & Physics
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      btn.setPointerCapture(e.pointerId);
      dragging = true;
      pointerStartX = e.clientX;
      dragStartVal = x;
    });

    btn.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const rect = btn.getBoundingClientRect();
      const capH = rect.height;
      const travel = Math.max(20, rect.width - capH);
      const dx = (e.clientX - pointerStartX) / travel;
      targetX = clamp(dragStartVal + dx, 0, 1);
    });

    btn.addEventListener('pointerup', (e) => {
      if (!dragging) return;
      dragging = false;
      const movedPx = Math.abs(e.clientX - pointerStartX);
      if (movedPx < 4) {
        // Click toggle
        targetX = x < 0.5 ? 1 : 0;
        if (targetX === 0 && x >= 0.9) {
          goingBack = true;
          leaveFocusClock = getClock();
        } else if (targetX === 1) {
          goingBack = false;
        }
      } else {
        const clampedVel = clamp(v, -3, 3);
        targetX = (x + clampedVel * 0.09 >= 0.5) ? 1 : 0;
        if (targetX === 0 && x >= 0.85) {
          goingBack = true;
          leaveFocusClock = getClock();
        } else if (targetX === 1) {
          goingBack = false;
        }
      }
      btn.setAttribute('aria-checked', targetX === 1 ? 'true' : 'false');
      btn.dispatchEvent(new Event('change', { bubbles: true }));
    });

    btn.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') {
        e.preventDefault();
        targetX = clamp(targetX + 0.04, 0, 1);
        goingBack = false;
        btn.setAttribute('aria-checked', targetX >= 0.5 ? 'true' : 'false');
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        if (x >= 0.98 && !goingBack) {
          goingBack = true;
          leaveFocusClock = getClock();
        }
        targetX = clamp(targetX - 0.04, 0, 1);
        btn.setAttribute('aria-checked', targetX >= 0.5 ? 'true' : 'false');
      } else if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        targetX = targetX < 0.5 ? 1 : 0;
        if (targetX === 0) {
          goingBack = true;
          leaveFocusClock = getClock();
        } else {
          goingBack = false;
        }
        btn.setAttribute('aria-checked', targetX === 1 ? 'true' : 'false');
        btn.dispatchEvent(new Event('change', { bubbles: true }));
      }
    });

    function stepPhysics(dt) {
      const prevX = x;
      if (dragging) {
        const alpha = 1.0 - Math.exp(-34 * dt);
        x = lerp(x, targetX, alpha);
        v = (x - prevX) / Math.max(dt, 1e-4);
        if (Math.abs(v) > 3.4 && fastDragCooldown <= 0 && !reducedMotion) {
          fastDragCooldown = 1.5;
          startleTimer = 1.1;
          bossPassTimer = 0.5;
        }
      } else {
        // Critically damped spring (omega = 9.5, or 16 when reduced motion)
        const omega = reducedMotion ? 16.0 : 9.5;
        const disp = x - targetX;
        const acc = -2 * omega * v - omega * omega * disp;
        v += acc * dt;
        x += v * dt;
        if (x <= 0) {
          if (v < -0.2 && !reducedMotion) bounceVel = Math.abs(v) * 2.2;
          x = 0; v = 0;
          if (goingBack) goingBack = false;
        } else if (x >= 1) {
          if (v > 0.2 && !reducedMotion) bounceVel = -Math.abs(v) * 2.2;
          x = 1; v = 0;
        }
      }

      // Press lift
      const targetPress = dragging ? 1 : 0;
      pressAmt = lerp(pressAmt, targetPress, 1.0 - Math.exp(-14 * dt));

      // Underdamped stretch spring (k=170, c=11)
      if (!reducedMotion) {
        const targetS = Math.abs(v) * 0.42;
        const sAcc = 170 * (targetS - stretchS) - 11 * stretchV;
        stretchV += sAcc * dt;
        stretchS += stretchV * dt;
        stretchS = clamp(stretchS, 0, 0.45);

        bounceOffset += bounceVel * dt;
        bounceVel += (-180 * bounceOffset - 16 * bounceVel) * dt;
      } else {
        stretchS = 0;
        bounceOffset = 0;
      }
    }

    function drawFrame(dt) {
      stepPhysics(dt);
      const { nightAmt, lampOn } = renderWorld(dt);

      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const rect = wrap.getBoundingClientRect();
      const cw = Math.max(10, Math.round(rect.width * dpr));
      const ch = Math.max(10, Math.round(rect.height * dpr));

      if (glCanvas.width !== cw || glCanvas.height !== ch) {
        glCanvas.width = cw; glCanvas.height = ch;
        fbCanvas.width = cw; fbCanvas.height = ch;
      }

      // Capsule dimensions: height = compH / 1.32, aspect 1.85
      const capH = ch / 1.32;
      const capW = capH * 1.85;
      const shellThick = capH * 0.046;
      const winH = capH - shellThick * 2;
      const winW = capW - shellThick * 2;

      // Integer scale k: floor(winH/112), or k+1 if cropped <= 12%
      let k = Math.max(1, Math.floor(winH / CORE_H));
      if (((k + 1) * CORE_H - winH) / ((k + 1) * CORE_H) <= 0.12) {
        k = k + 1;
      }

      const lensRad = (winH * 0.5 - capH * 0.032) * (1.0 + pressAmt * 0.012);
      const lensTravel = winW - winH;
      const lensX = (cw * 0.5 - lensTravel * 0.5) + x * lensTravel + bounceOffset;

      if (!comp) {
        // 2D Canvas fallback
        glCanvas.style.display = 'none';
        fbCanvas.style.display = 'block';
        const ctx = fbCanvas.getContext('2d');
        ctx.clearRect(0, 0, cw, ch);
        ctx.save();
        roundRectPath(ctx, (cw - capW)*0.5, (ch - capH)*0.5, capW, capH, capH * 0.5);
        ctx.clip();
        fallbackImageData.data.set(rgbaBuf);
        fallbackBitmapCtx.putImageData(fallbackImageData, 0, 0);
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(fallbackBitmap, (cw - CORE_W*k)*0.5 - PAD*k, (ch - CORE_H*k)*0.5 - PAD*k, FULL_W*k, FULL_H*k);
        ctx.fillStyle = 'rgba(255,255,255,0.28)';
        ctx.beginPath();
        ctx.arc(lensX, ch * 0.5, lensRad, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        return;
      }

      const { gl, prog, vao, worldTex, lightTex, locs } = comp;
      gl.viewport(0, 0, cw, ch);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

      gl.useProgram(prog);
      gl.bindVertexArray(vao);

      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, worldTex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, FULL_W, FULL_H, 0, gl.RGBA, gl.UNSIGNED_BYTE, rgbaBuf);
      gl.uniform1i(locs.uWorldTex, 0);

      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, lightTex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 72, 42, 0, gl.RGBA, gl.UNSIGNED_BYTE, lightRgba);
      gl.uniform1i(locs.uLightTex, 1);

      gl.uniform1f(locs.uHasSurf, 0.0);
      gl.uniform2f(locs.uCompSize, cw, ch);
      gl.uniform2f(locs.uCapCenter, cw * 0.5, ch * 0.5);
      gl.uniform2f(locs.uCapSize, capW, capH);
      gl.uniform1f(locs.uShellThick, shellThick);
      gl.uniform1f(locs.uLensX, lensX);
      gl.uniform1f(locs.uLensRad, lensRad);
      gl.uniform2f(locs.uLensStretch, 1.0 + 0.2 * stretchS, 1.0 - 0.075 * stretchS);
      gl.uniform1f(locs.uPress, pressAmt);
      gl.uniform1f(locs.uDispersion, 0.05);
      gl.uniform1f(locs.uNight, nightAmt);

      const dayShell = PAL[IDX.bg[3]];
      const nightShell = PAL[IDX.fg[1]];
      gl.uniform3f(locs.uShellDayCol, dayShell[0]/255, dayShell[1]/255, dayShell[2]/255);
      gl.uniform3f(locs.uShellNightCol, nightShell[0]/255, nightShell[1]/255, nightShell[2]/255);
      gl.uniform3f(locs.uWarmGlowCol, 0.96, 0.65, 0.22);
      gl.uniform1f(locs.uWarmGlowAmt, lampOn ? 1.0 : 0.0);
      gl.uniform2f(locs.uWarmCentroid, 145 / CORE_W, 57 / CORE_H);
      gl.uniform1f(locs.uFlash, 0.0);
      gl.uniform1f(locs.uK, k);
      gl.uniform2f(locs.uWinTopLeft, (cw - CORE_W * k) * 0.5, (ch - CORE_H * k) * 0.5);
      gl.uniform2f(locs.uWinSize, CORE_W * k, CORE_H * k);
      gl.uniform2f(locs.uPad, PAD, PAD);
      gl.uniform2f(locs.uWorldTexSize, FULL_W, FULL_H);
      gl.uniform1f(locs.uTime, simTime);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }

    return { drawFrame, getNight: () => {
      const h = getClock() % 24;
      return clamp(smoothstep(17.4, 20.2, h) + (1.0 - smoothstep(1.5, 3.6, h)), 0, 1);
    }};
  })();

  // =========================================================================
  // SCENE 2: BEIJING FOUR SEASONS SCROLL SWITCH
  // =========================================================================

    function getAnnualY() {
      return !isReturn ? (3.0 * x) : (3.0 + (1.0 - x));
    }

    function getLightingState(Y) {
      // Lighting columns: 0=Day, 1=Golden, 2=Dusk, 3=Night
      if (!isReturn) {
        if (Y <= 1.3) return { c0: 0, c1: 0, blend: 0 };
        if (Y <= 1.7) return { c0: 0, c1: 1, blend: (Y - 1.3) / 0.4 };
        if (Y <= 2.3) return { c0: 1, c1: 1, blend: 0 };
        if (Y <= 2.55) return { c0: 1, c1: 2, blend: (Y - 2.3) / 0.25 };
        if (Y <= 2.75) return { c0: 2, c1: 2, blend: 0 };
        if (Y <= 2.95) return { c0: 2, c1: 3, blend: (Y - 2.75) / 0.2 };
        return { c0: 3, c1: 3, blend: 0 };
      } else {
        // Return path: midnight -> dawn -> sunrise (monotonically brightening)
        const p = clamp(Y - 3.0, 0, 1); // 0 at winter (g), 1 at spring (a)
        if (p < 0.35) return { c0: 3, c1: 3, blend: 0 };
        if (p < 0.65) return { c0: 3, c1: 2, blend: (p - 0.35) / 0.30 };
        if (p < 0.88) return { c0: 2, c1: 1, blend: (p - 0.65) / 0.23 };

    function setPx(cx, cy, colIdx) {
      const fx = cx + PAD, fy = cy + PAD;

    function fillRect(x0, y0, w, h, colIdx) {
      for (let y = y0; y < y0 + h; y++) {
