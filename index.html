    }

    function sampleSeasonalMat(mat4x4, sb, lf, xw, y) {
      const b = BAYER4[(y & 3) * 4 + (xw & 3)] / 16.0;
      const s = sb.blend > b ? sb.s1 : sb.s0;
      const l = lf.blend > b ? lf.c1 : lf.c0;
      return mat4x4[s][l];
    }

    function sampleStaticMat(mat4, lf, xw, y) {
      const b = BAYER4[(y & 3) * 4 + (xw & 3)] / 16.0;
      const l = lf.blend > b ? lf.c1 : lf.c0;
      return mat4[l];
    }

    function addLight(cx, cy, r, g, b, weight) {
      const gx = clamp(Math.floor(((cx + PAD) / fullW) * 144), 0, 143);
      const gy = clamp(Math.floor(((cy + PAD) / fullH) * 44), 0, 43);
      const o = (gy * 144 + gx) * 3;
      emitGrid[o] += r * weight;
      emitGrid[o + 1] += g * weight;
      emitGrid[o + 2] += b * weight;
    }

    function bump(x, center, width) {
      const d = (x - center) / width;
      if (Math.abs(d) >= 1.0) return 0;
      return 0.5 * (1.0 + Math.cos(Math.PI * d));
    }

    function drawSeal(stopIdx) {
      const sw = 15, sh = 51;
      sealCanvas.width = sw;
      sealCanvas.height = sh;
      const img = sealCtx.createImageData(sw, sh);
      const d = img.data;
      const chars = isReturn ? ['雪', '至', '年', '春'] : ['春', '夏', '秋', '冬'];
      const activeCharIdx = isReturn ? (3 - stopIdx) : stopIdx;

      const baseRed = PAL[IDX.red[1]];
      const speckRed = PAL[IDX.red[2]];
      const palePink = PAL[IDX.red[2]];
      const whitePaper = PAL[IDX.paper[3]];

      for (let y = 0; y < sh; y++) {
        for (let xw = 0; xw < sw; xw++) {
          const o = (y * sw + xw) * 4;
          // Missing 4 corners
          if ((xw === 0 || xw === sw - 1) && (y === 0 || y === sh - 1)) continue;
          // ~22% random edge erosion
          const isEdge = (xw === 0 || xw === sw - 1 || y === 0 || y === sh - 1);
          const h = ((xw * 73 + y * 137) & 255) / 255;
          if (isEdge && h < 0.22) continue;

          let rgb = ((xw * 31 + y * 59) & 15) === 0 ? speckRed : baseRed;

          // 4 vertical 11x11 glyphs, 1px spacing
          const charSlot = Math.floor((y - 2) / 12);
          const gy = (y - 2) % 12;
          const gx = xw - 2;
          if (charSlot >= 0 && charSlot < 4 && gy >= 0 && gy < 11 && gx >= 0 && gx < 11) {
            const glyph = SEAL_GLYPHS[chars[charSlot]];
            if (glyph && glyph[gy][gx] === '#') {
              const isLit = (charSlot === activeCharIdx);
              if (isLit) {
                const ditherIn = sealFadeFrames > 0 && BAYER4[(y & 3)*4 + (xw & 3)] > (4 - sealFadeFrames) * 4;
                rgb = ditherIn ? palePink : whitePaper;
              } else {
                rgb = palePink;
              }
            }
          }

          d[o] = rgb[0]; d[o + 1] = rgb[1]; d[o + 2] = rgb[2]; d[o + 3] = 255;
        }
      }
      sealCtx.putImageData(img, 0, 0);
    }

    function updateSurfaceTexture(Y, dt) {
      surfRgba.fill(0);
      const setS = (sx, sy, col, a = 255) => {
        if (sx < 0 || sx >= 48 || sy < 0 || sy >= 48) return;
        const o = (sy * 48 + sx) * 4;
        surfRgba[o] = col[0]; surfRgba[o + 1] = col[1]; surfRgba[o + 2] = col[2]; surfRgba[o + 3] = a;
      };

      if (!isReturn && Y < 0.55) {
        // Spring: 2-3 willow catkins jiggling gently on drag
        const jiggle = Math.round(v * 1.5);
        [[14, 16], [31, 22], [20, 34]].forEach(([bx, by], i) => {
          const cx = bx + ((i & 1) ? jiggle : -jiggle);
          setS(cx, by, PAL[IDX.paper[3]], 235);
          setS(cx + 1, by, PAL[IDX.paper[2]], 210);
          setS(cx, by + 1, PAL[IDX.paper[2]], 210);
        });
      } else if (!isReturn && Y >= 0.55 && Y < 1.45) {
        // Summer: raindrops merging and sliding down with water trails
        for (const dr of rainDrops) {
          if (!reducedMotion) {
            dr.y += dr.vy * dt * 2.4;
            if (dr.y > 42) dr.y = 6;
          }
          const rx = Math.round(dr.x), ry = Math.round(dr.y);
          setS(rx, ry, PAL[IDX.paper[3]], 210);
          setS(rx, ry - 1, PAL[IDX.blue[3]], 150);
          setS(rx, ry - 2, PAL[IDX.blue[2]], 85);
        }
      } else if (!isReturn && Y >= 1.5 && Y < 2.45) {
        // Autumn: ginkgo leaf sliding across lens
        const phase = (simTime * 0.22) % 1.0;
        const lx = Math.round(10 + phase * 26 + Math.sin(phase * 6.28) * 4);
        const ly = Math.round(6 + phase * 34);
        setS(lx, ly, PAL[IDX.gold[3]], 245);
        setS(lx + 1, ly, PAL[IDX.gold[2]], 245);
        setS(lx, ly + 1, PAL[IDX.gold[2]], 245);
        setS(lx - 1, ly + 1, PAL[IDX.gold[1]], 245);
      } else if (Y >= 2.55) {
        // Winter: frost along top rim + snow pile on top (shaken off if dragged fast)
        if (Math.abs(v) > 2.8) snowCapAmt = Math.max(0.15, snowCapAmt - dt * 2.5);
        else snowCapAmt = Math.min(1.0, snowCapAmt + dt * 0.15);

        for (let sx = 10; sx < 38; sx++) {
          const distCenter = Math.abs(sx - 24);
          if (distCenter < 13) {
            const topY = Math.round(2 + (distCenter * distCenter) / 38);
            setS(sx, topY, PAL[IDX.blue[3]], 210);
            if (snowCapAmt > 0.3 && distCenter < 10 * snowCapAmt) {
              setS(sx, topY + 1, PAL[IDX.paper[3]], 245);
              setS(sx, topY + 2, PAL[IDX.paper[2]], 220);
            }
          }
        }
      }
    }

    function renderWorld(dt, centers) {
      simTime += dt;
      if (fastDragCd > 0) fastDragCd -= dt;
      if (birdsStartled > 0) birdsStartled -= dt;
      if (catJumpTimer > 0) catJumpTimer -= dt;
      if (sealFadeFrames > 0) sealFadeFrames--;

      const Y = getAnnualY();
      const lf = getLightingState(Y);
      const sb = getSeasonBlend(Y);

      // Winter 30s snow accumulation -> snow stops & moon emerges around 23:00
      if (!isReturn && x >= 0.995 && !dragging) {
        winterStaySec = Math.min(35, winterStaySec + dt);
      } else if (!isReturn && x < 0.96) {
        winterStaySec = 0;
      }

      // Summer lightning (Y in 0.62..0.96)
      let flash = 0;
      if (!isReturn && Y >= 0.62 && Y <= 0.96 && !reducedMotion) {
        nextLightning -= dt;
        if (nextLightning <= 0) {
          lightningTimer = 0.08;
          nextLightning = 4.2 + Math.random() * 4.5;
        }
      }
      if (lightningTimer > 0) {
        lightningTimer -= dt;
        flash = 1.0;
      }

      // Stage night background (~0.85 on winter night, 0 otherwise)
      let nightAmt = 0;
      if (Y >= 2.75 && Y <= 3.35) {
        nightAmt = 0.85 * smoothstep(2.75, 2.98, Y) * (1.0 - smoothstep(3.15, 3.45, Y));
      }
      stage.style.setProperty('--night', nightAmt.toFixed(3));
      if (flash > 0.5) {
        stage.style.backgroundColor = '#ffffff';
      } else {
        stage.style.backgroundColor = mixOklabHex('#f2ece0', '#1c2236', nightAmt);
      }

      emitGrid.fill(0);

      // Seasonal x Lighting Material Tables
      const MAT_SKY = [
        [IDX.blue[3], IDX.gold[3], IDX.red[3], IDX.ink[0]],
        [IDX.blue[2], IDX.gold[2], IDX.red[2], IDX.ink[0]],
        [IDX.blue[2], IDX.gold[2], IDX.red[2], IDX.ink[1]],
        [IDX.blue[3], IDX.gold[3], IDX.ink[2], IDX.ink[0]]
      ];
      const MAT_MTN_SUN = [
        [IDX.green[3], IDX.gold[2], IDX.red[1], IDX.ink[2]],
        [IDX.green[2], IDX.gold[1], IDX.red[1], IDX.ink[2]],
        [IDX.green[1], IDX.gold[2], IDX.red[1], IDX.ink[2]],
        [IDX.paper[3], IDX.paper[2], IDX.blue[3], IDX.blue[3]]
      ];
      const MAT_MTN_SHADE = [
        [IDX.green[1], IDX.green[0], IDX.ink[2], IDX.ink[1]],
        [IDX.green[0], IDX.green[0], IDX.ink[2], IDX.ink[1]],
        [IDX.green[0], IDX.green[0], IDX.ink[2], IDX.ink[1]],
        [IDX.blue[3],  IDX.blue[2],  IDX.blue[2], IDX.blue[2]]
      ];
      const MAT_WATER = [
        [IDX.blue[3], IDX.gold[2], IDX.red[2], IDX.ink[1]],
        [IDX.blue[2], IDX.blue[1], IDX.ink[2], IDX.ink[1]],
        [IDX.blue[1], IDX.gold[1], IDX.ink[2], IDX.ink[1]],
        [IDX.blue[3], IDX.blue[3], IDX.blue[2], IDX.blue[2]]
      ];
      const MAT_GRASS = [
        [IDX.green[3], IDX.gold[2], IDX.green[1], IDX.ink[1]],
        [IDX.green[2], IDX.green[1], IDX.ink[2], IDX.ink[1]],
        [IDX.gold[1],  IDX.gold[0],  IDX.red[0], IDX.ink[1]],
        [IDX.paper[3], IDX.paper[2], IDX.blue[3], IDX.blue[3]]
      ];
      const MAT_ROAD = [
        [IDX.paper[1], IDX.gold[2], IDX.ink[3], IDX.ink[2]],
        [IDX.paper[1], IDX.paper[0], IDX.ink[3], IDX.ink[2]],
        [IDX.gold[2],  IDX.gold[1],  IDX.red[1], IDX.ink[2]],
        [IDX.paper[2], IDX.paper[1], IDX.blue[3], IDX.blue[2]]
      ];

      // Static (non-seasonal) 4-lighting palettes
      const MAT_WALL_RED = [IDX.red[1], IDX.red[2], IDX.red[0], IDX.red[0]];
      const MAT_ROOF_GOLD = [IDX.gold[2], IDX.gold[3], IDX.gold[1], IDX.gold[0]];
      const MAT_ROOF_BLUE = [IDX.blue[1], IDX.blue[1], IDX.blue[0], IDX.ink[2]];
      const MAT_MARBLE = [IDX.paper[3], IDX.gold[3], IDX.paper[1], IDX.blue[2]];

      const [a, c, t, g] = centers;

      // Sky tint base into light field
      const skyTint = sb.s0 === 0 ? [0.98, 0.88, 0.90] : (sb.s0 === 1 ? [0.96, 0.98, 1.0] : (sb.s0 === 2 ? [1.0, 0.82, 0.45] : [0.35, 0.48, 0.78]));
      const skyStr = sb.s0 === 3 ? 0.14 : 0.32;
      for (let i = 0; i < 144 * 44; i++) {
        emitGrid[i * 3 + 0] += skyTint[0] * skyStr;
        emitGrid[i * 3 + 1] += skyTint[1] * skyStr;
        emitGrid[i * 3 + 2] += skyTint[2] * skyStr;
      }

      // 1. Sky Background (y = -PAD .. 65)
      for (let y = -PAD; y < 65; y++) {
        for (let xw = -PAD; xw < coreW + PAD; xw++) {
          let col = sampleSeasonalMat(MAT_SKY, sb, lf, xw, y);
          // Spring dawn horizon pale glow + low sun at left
          if (!isReturn && Y < 0.35 && y > 38) col = IDX.paper[3];
          // Autumn upper-blue / lower-gold sky
          if (!isReturn && Y >= 1.65 && Y <= 2.35 && y > 34) col = IDX.gold[3];
          setPx(xw, y, col);
        }
      }

      // Sun / Moon & Stars
      if (!isReturn && Y < 0.45) {
        // Spring morning sun at left
        fillRect(a - 36, 36, 5, 5, IDX.gold[3]);
        addLight(a - 34, 38, 1.0, 0.85, 0.55, 1.4);
      } else if (!isReturn && Y >= 1.65 && Y <= 2.35) {
        // Autumn setting sun at left
        fillRect(t - 38, 38, 6, 6, IDX.gold[2]);
        addLight(t - 35, 41, 1.0, 0.68, 0.25, 1.6);
      } else if (Y >= 2.8) {
        // Winter night stars + moon (emerges after snow stops at 23:00)
        for (let s = 0; s < 26; s++) {
          const sx = (s * 43 + 11) % coreW;
          const sy = 4 + ((s * 19) % 28);
          setPx(sx, sy, IDX.paper[3]);
        }
        if (winterStaySec > 18 || isReturn) {
          fillRect(g - 26, 12, 5, 5, IDX.paper[3]);
          addLight(g - 24, 14, 0.75, 0.85, 1.0, 0.9);
        }
      }

      // 2. Far Horizon: Western Hills (left half) + City Silhouette (right half) + Beihai White Dagoba
      for (let xw = -PAD; xw < coreW + PAD; xw++) {
        if (xw < (c + t) * 0.5) {
          const hillTop = Math.round(44 + (xw / coreW) * 18 - Math.sin(xw * 0.04) * 3);
          setPx(xw, hillTop, IDX.paper[2]);
          for (let y = hillTop + 1; y < 65; y++) setPx(xw, y, IDX.blue[3]);
        } else {
          const cityTop = 55 - ((xw * 13) % 5);
          for (let y = cityTop; y < 65; y++) {
            setPx(xw, y, nightAmt > 0.4 ? IDX.ink[1] : IDX.blue[2]);
          }
          if (nightAmt > 0.5 && (xw % 4 === 0)) {
            setPx(xw, cityTop + 2, IDX.gold[2]);
          }
        }
      }
      // Beihai White Dagoba Easter Egg on horizon between Summer Palace (c) and Temple of Heaven (t)
      const bx = Math.round((c + t) * 0.5);
      fillRect(bx - 2, 52, 5, 4, IDX.paper[3]);
      fillRect(bx - 1, 49, 3, 3, IDX.paper[3]);
      setPx(bx, 47, IDX.gold[3]);

      // 3. Scenic Landmark 1: Great Wall (center a)
      const wallNodes = [
        [-PAD, 66, 6], [a - 32, 50, 5], [a - 18, 37, 5], [a - 7, 49, 4],
        [a + 2, 53, 4], [a + 16, 35, 4], [a + 28, 46, 3], [a + 36, 49, 3],
        [a + 46, 38, 2], [a + 58, 45, 2], [a + 72, 50, 1]
      ];
      function getWallAt(xw) {
        for (let i = 0; i < wallNodes.length - 1; i++) {
          const [x0, y0, th0] = wallNodes[i];
          const [x1, y1, th1] = wallNodes[i + 1];
          if (xw >= x0 && xw <= x1) {
            const f = (xw - x0) / Math.max(1, x1 - x0);
            return { y: Math.round(lerp(y0, y1, f)), th: Math.max(1, Math.round(lerp(th0, th1, f))) };
          }
        }
        return null;
      }

      const meltY = isReturn ? Math.round(lerp(66, 24, clamp((Y - 3.65) / 0.35, 0, 1))) : 0;

      for (let xw = a - 65; xw <= a + 76; xw++) {
        // 3 rounded peaks taller than the Great Wall
        const ridge = Math.round(45 - 19 * bump(xw, a - 18, 25) - 21 * bump(xw, a + 16, 23) - 14 * bump(xw, a + 46, 19) + Math.max(0, (xw - (a + 30)) * 0.42));
        const ridgeNext = Math.round(45 - 19 * bump(xw + 1, a - 18, 25) - 21 * bump(xw + 1, a + 16, 23) - 14 * bump(xw + 1, a + 46, 19) + Math.max(0, (xw + 1 - (a + 30)) * 0.42));
        const isSunFacing = ridgeNext <= ridge; // Light from left

        for (let y = ridge; y < 65; y++) {
          let col = isSunFacing
            ? sampleSeasonalMat(MAT_MTN_SUN, sb, lf, xw, y)
            : sampleSeasonalMat(MAT_MTN_SHADE, sb, lf, xw, y);

          // Lichun snow melting bottom-up on return
          if (isReturn && Y > 3.65 && y >= meltY) {
            col = isSunFacing ? IDX.green[3] : IDX.green[1];
          }
          // Spring pink/white mountain peach blossoms (~9% accent)
          if ((!isReturn && sb.s0 === 0) || (isReturn && Y > 3.75 && y >= meltY)) {
            const h = ((xw * 47 + y * 83) & 255) / 255;
            if (h < 0.09) col = (h < 0.045) ? IDX.red[3] : IDX.paper[3];
          }
          // Autumn red foliage flecks
          if (!isReturn && sb.s0 === 2) {
            const h = ((xw * 53 + y * 97) & 255) / 255;
            if (h < 0.08) col = IDX.red[2];
          }
          setPx(xw, y, col);
        }

        // Great Wall ribbon backed against the mountain slope
        const wSeg = getWallAt(xw);
        if (wSeg) {
          const isWinterSnow = (Y >= 2.75 && !(isReturn && Y > 3.85));
          const topCol = isWinterSnow ? IDX.paper[3] : sampleStaticMat([IDX.paper[2], IDX.gold[3], IDX.paper[1], IDX.blue[2]], lf, xw, wSeg.y);
          const bodyCol = isWinterSnow ? IDX.ink[3] : sampleStaticMat([IDX.paper[1], IDX.gold[2], IDX.paper[0], IDX.ink[2]], lf, xw, wSeg.y + 1);
          setPx(xw, wSeg.y, topCol);
          if ((xw & 1) === 0) setPx(xw, wSeg.y - 1, topCol); // Crenellations every 2 cols
          for (let dy = 1; dy <= wSeg.th; dy++) setPx(xw, wSeg.y + dy, bodyCol);
          setPx(xw, wSeg.y + wSeg.th + 1, IDX.ink[1]);
          setPx(xw, wSeg.y + wSeg.th + 2, IDX.ink[2]);
        }
      }

      // 3 Watchtowers (9x9 at a-18, 7x7 at a+16, 5x5 at a+46)
      [[a - 18, 37, 9], [a + 16, 35, 7], [a + 46, 38, 5]].forEach(([tx, wy, sz]) => {
        const half = Math.floor(sz / 2);
        const topY = wy - sz + 2;
        for (let dy = 0; dy < sz; dy++) {
          for (let dx = -half; dx <= half; dx++) {
            const col = dx < 0 ? IDX.paper[2] : IDX.paper[0];
            setPx(tx + dx, topY + dy, nightAmt > 0.5 ? IDX.ink[2] : col);
          }
        }
        // Crenellations & dark arched windows
        for (let dx = -half; dx <= half; dx += 2) setPx(tx + dx, topY - 1, IDX.paper[3]);
        setPx(tx, topY + Math.floor(sz * 0.5), IDX.ink[0]);
      });

      // Tourist taking selfie on Great Wall near a-10 + first peach blossom at Lichun
      setPx(a - 10, 44, IDX.red[2]);
      setPx(a - 10, 43, IDX.paper[3]);
      setPx(a - 9, 43, IDX.blue[3]); // Phone
      if (isReturn && Y > 3.7) {
        setPx(a - 14, 36, IDX.red[3]);
        setPx(a - 13, 36, IDX.paper[3]);
      }

      // 4. Scenic Landmark 2: Summer Palace (center c)
      // Longevity Hill (center c+22, top y42, parabolic)
      for (let xw = c - 14; xw <= c + 56; xw++) {
        const d = (xw - (c + 22)) / 34;
        if (Math.abs(d) <= 1.0) {
          const hy = Math.round(42 + d * d * 23);
          const sunSide = xw <= c + 22;
          for (let y = hy; y < 65; y++) {
            setPx(xw, y, sunSide ? sampleSeasonalMat(MAT_MTN_SUN, sb, lf, xw, y) : sampleSeasonalMat(MAT_MTN_SHADE, sb, lf, xw, y));
          }
        }
      }
      // Tower of Buddhist Incense (c+22, triple octagonal roof, gold tiles + green trim, red pillars)
      const fx = c + 22;
      fillRect(fx - 4, 41, 9, 3, IDX.paper[1]); // Stone base
      fillRect(fx - 3, 37, 7, 4, sampleStaticMat(MAT_WALL_RED, lf, fx, 38));
      [[35, 5], [31, 4], [27, 3]].forEach(([ry, hw]) => {
        fillRect(fx - hw, ry, hw * 2 + 1, 2, sampleStaticMat(MAT_ROOF_GOLD, lf, fx, ry));
        setPx(fx - hw, ry + 1, IDX.green[2]);
        setPx(fx + hw, ry + 1, IDX.green[2]);
      });
      setPx(fx, 25, IDX.gold[3]);
      // 3 Paiyun Hall small gold roofs on hillside
      [[c + 12, 47], [c + 22, 48], [c + 32, 47]].forEach(([px, py]) => {
        fillRect(px - 2, py, 5, 2, sampleStaticMat(MAT_ROOF_GOLD, lf, px, py));
      });

      // 5. Scenic Landmark 3: Temple of Heaven (center t)
      // Cypress groves & Ginkgo trees at t +- 39
      for (let xw = c + 44; xw <= g - 44; xw++) {
        const distT = Math.abs(xw - t);
        if (distT > 16 && (xw % 6 === 0)) {
          const treeH = Math.max(5, Math.round(16 - distT * 0.16));
          const isGinkgo = (Math.abs(xw - (t - 39)) <= 2 || Math.abs(xw - (t + 39)) <= 2);
          const crownTop = 64 - treeH - (isGinkgo ? 3 : 0);
          const crownCol = isGinkgo
            ? (sb.s0 === 2 ? IDX.gold[3] : (sb.s0 === 3 ? IDX.ink[2] : IDX.green[2]))
            : (sb.s0 === 3 ? IDX.ink[2] : IDX.green[1]);
          fillRect(xw, 64 - 3, 1, 3, IDX.ink[1]);
          fillRect(xw - 2, crownTop, 5, treeH - 2, crownCol);
          if (sb.s0 === 3) fillRect(xw - 2, crownTop, 5, 1, IDX.paper[3]); // Snow cap
        }
      }
      // Hall of Prayer for Good Harvests (triple blue tiled roofs y18..25, 27..34, 36..44, gold finial y12..17)
      fillRect(t, 12, 1, 6, IDX.gold[3]);
      [[18, 8, 6], [27, 8, 9], [36, 9, 12]].forEach(([ry, rh, hw]) => {
        for (let dy = 0; dy < rh; dy++) {
          const curW = Math.round(hw * (0.45 + 0.55 * (dy / rh)));
          fillRect(t - curW, ry + dy, curW * 2 + 1, 1, sampleStaticMat(MAT_ROOF_BLUE, lf, t, ry + dy));
          if (sb.s0 === 3 && dy === 0) fillRect(t - curW, ry, curW * 2 + 1, 1, IDX.paper[3]);
        }
        fillRect(t - hw + 2, ry + rh, (hw - 2) * 2 + 1, 2, sampleStaticMat(MAT_WALL_RED, lf, t, ry + rh));
      });
      // 3-tier White Marble Altar (y49..60) with balustrades
      [[49, 4, 15], [53, 4, 18], [57, 4, 21]].forEach(([ay, ah, hw]) => {
        const mCol = sampleStaticMat(MAT_MARBLE, lf, t, ay);
        fillRect(t - hw, ay, hw * 2 + 1, ah, mCol);
        for (let bx = t - hw; bx <= t + hw; bx += 2) setPx(bx, ay - 1, mCol);
      });
      // Low hedge row in front of altar + Dongzhi lantern pole at Winter Solstice
      fillRect(t - 22, 61, 45, 3, sb.s0 === 3 ? IDX.paper[3] : IDX.green[1]);
      if (isReturn && Y >= 3.2 && Y <= 3.55) {
        fillRect(t - 26, 36, 1, 28, IDX.ink[2]);
        fillRect(t - 27, 38, 3, 3, IDX.red[2]);
        addLight(t - 26, 39, 1.0, 0.35, 0.2, 1.4);
      }

      // 6. Scenic Landmark 4: Forbidden City Corner Tower (center g)
      // Palace Wall from g-62 to right edge (yellow tile cap y56..58, red wall y59..61)
      const wallStart = g - 62;
      fillRect(wallStart, 56, fullW - wallStart, 3, sb.s0 === 3 ? IDX.paper[3] : sampleStaticMat(MAT_ROOF_GOLD, lf, g, 57));
      fillRect(wallStart, 59, fullW - wallStart, 3, sampleStaticMat(MAT_WALL_RED, lf, g, 60));

      // Corner Tower (stone base y52..55, red walls y42..51, triple eaves, cross ridges, finial y11..15)
      fillRect(g - 13, 52, 27, 4, sampleStaticMat(MAT_MARBLE, lf, g, 53));
      fillRect(g - 11, 42, 23, 10, sampleStaticMat(MAT_WALL_RED, lf, g, 45));
      [[38, 4, 14], [30, 7, 11], [21, 8, 8], [16, 5, 4]].forEach(([ey, eh, hw]) => {
        fillRect(g - hw, ey, hw * 2 + 1, eh, sampleStaticMat(MAT_ROOF_GOLD, lf, g, ey));
        if (sb.s0 === 3) {
          fillRect(g - hw, ey, hw * 2 + 1, 1, IDX.paper[3]);
          setPx(g - hw - 1, ey + eh - 1, IDX.paper[3]);
          setPx(g + hw + 1, ey + eh - 1, IDX.paper[3]);
        }
      });
      fillRect(g, 11, 1, 5, IDX.gold[3]);
      if (sb.s0 === 3) addLight(g, 13, 1.0, 0.78, 0.3, 0.7);

      // Red Lanterns every 12 columns along palace wall + under corner tower eaves
      if (sb.s0 === 3) {
        for (let lx = wallStart + 4; lx < fullW - PAD; lx += 12) {
          fillRect(lx, 59, 2, 2, IDX.red[2]);
          addLight(lx, 60, 1.0, 0.32, 0.18, 0.85);
        }
        [-9, 9].forEach(dx => {
          fillRect(g + dx, 42, 2, 2, IDX.red[2]);
          addLight(g + dx, 43, 1.0, 0.32, 0.18, 0.9);
        });
      }

      // Two Weeping Willows flanking palace wall
      [g - 56, g + 26].forEach(wx => {
        const sway = (!reducedMotion && sb.s0 !== 3) ? Math.round(Math.sin(simTime * 2.2 + wx) * 1) : 0;
        fillRect(wx, 50, 2, 12, IDX.ink[1]);
        const wCol = sb.s0 === 2 ? IDX.gold[2] : (sb.s0 === 3 ? IDX.ink[2] : IDX.green[2]);
        for (let bx = -5; bx <= 5; bx += 2) {
          fillRect(wx + bx + sway, 46, 1, sb.s0 === 3 ? 7 : 12, wCol);
        }
      });

      // Mist Bands dividing the 4 scenes at foothill height (tapered ends)
      [Math.round((a + c) * 0.5), Math.round((c + t) * 0.5), Math.round((t + g) * 0.5)].forEach(mx => {
        for (let dx = -16; dx <= 16; dx++) {
          const span = Math.round(3 * (1.0 - Math.abs(dx) / 17));
          for (let dy = 0; dy < span; dy++) {
            setPx(mx + dx, 59 + dy, nightAmt > 0.5 ? IDX.blue[3] : IDX.paper[3]);
          }
        }
      });

      // 7. Continuous River / Lake / Moat (y = 62..68)
      for (let y = 62; y < 69; y++) {
        for (let xw = -PAD; xw < coreW + PAD; xw++) {
          let wCol = sampleSeasonalMat(MAT_WATER, sb, lf, xw, y);
          // Kunming Lake reflection on alternating rows (not in frozen winter)
          if (sb.s0 !== 3 && Math.abs(xw - (c + 22)) < 16 && (y & 1) === 0) {
            wCol = IDX.gold[1];
          }
          // Winter ice cracks (no reflections)
          if (sb.s0 === 3 && ((xw + y * 5) % 19 === 0)) {
            wCol = IDX.paper[3];
          }
          setPx(xw, y, wCol);
        }
      }
      // Seventeen-Arch Bridge (c-46 to c+8, arched 2 rows, 17 small arches)
      for (let xw = c - 46; xw <= c + 8; xw++) {
        const archProgress = (xw - (c - 46)) / 54;
        const archLift = Math.round(Math.sin(archProgress * Math.PI) * 2);
        const by = 63 - archLift;
        fillRect(xw, by, 1, 2, IDX.paper[2]);
        if ((xw - (c - 46)) % 3 === 1) {
          setPx(xw, by + 2, IDX.ink[1]); // Arch opening
        }
        if (isReturn && Y >= 3.35 && Y <= 3.7 && (xw % 4 === 0)) {
          setPx(xw, by - 1, IDX.red[2]); // Spring Festival red lanterns on bridge
          addLight(xw, by - 1, 1.0, 0.3, 0.18, 0.65);
        }
      }
      // Lotuses in Kunming Lake (c+16..c+46) + Ice skaters on Tongzi River / Kunming Lake
      if (sb.s0 === 0 || sb.s0 === 1) {
        for (let lx = c + 16; lx <= c + 46; lx += 4) {
          setPx(lx, 66, IDX.green[2]);
          if (sb.s0 === 1 && (lx % 8 === 0)) setPx(lx, 65, IDX.red[3]);
        }
      } else if (sb.s0 === 3) {
        // Kids on ice sleds on Tongzi River (g) + morning skaters at Chunjie (c)
        const sledX = g - 16 + Math.round(Math.sin(simTime * 1.4) * 12);
        fillRect(sledX, 64, 4, 2, IDX.red[2]);
        setPx(sledX + 1, 63, IDX.gold[3]);
        if (isReturn && Y >= 3.35 && Y <= 3.7) {
          const skX = c - 10 + Math.round(Math.cos(simTime * 1.8) * 14);
          fillRect(skX, 64, 2, 3, IDX.red[2]);
        }
      }

      // Summer Diagonal Rain & Rainbow over 17-Arch Bridge (red outer, blue inner)
      if (!isReturn && Y >= 0.62 && Y <= 0.96 && !reducedMotion) {
        for (let r = 0; r < 55; r++) {
          const rx = c - 48 + ((r * 13 + Math.floor(simTime * 28)) % 96);
          const ry = 10 + ((r * 17 + Math.floor(simTime * 42)) % 52);
          setPx(rx, ry, IDX.paper[3]);
          setPx(rx - 1, ry + 1, IDX.blue[3]);
        }
      }
      if (!isReturn && Y >= 0.90 && Y <= 1.32) {
        const rbBands = [IDX.red[2], IDX.gold[3], IDX.green[3], IDX.blue[3]];
        for (let rx = c - 44; rx <= c + 6; rx++) {
          const norm = (rx - (c - 19)) / 25;
          if (Math.abs(norm) <= 1.0) {
            const topY = Math.round(32 + norm * norm * 22);
            rbBands.forEach((bCol, bi) => {
              if (BAYER4[((topY + bi) & 3) * 4 + (rx & 3)] < 11) {
                setPx(rx, topY + bi, bCol);
              }
            });
          }
        }
      }

      // 8. Continuous Path (rows 69..71, cat feet at row 70) & Foreground Meadow (rows 72..95+PAD)
      for (let y = 69; y <= 71; y++) {
        for (let xw = -PAD; xw < coreW + PAD; xw++) {
          let rCol = sampleSeasonalMat(MAT_ROAD, sb, lf, xw, y);
          if (sb.s0 === 2 && ((xw * 11 + y * 7) % 13 === 0)) rCol = IDX.gold[3]; // Fallen ginkgo leaves
          setPx(xw, y, rCol);
        }
      }
      for (let y = 72; y < CORE_H + PAD; y++) {
        for (let xw = -PAD; xw < coreW + PAD; xw++) {
          let gCol = sampleSeasonalMat(MAT_GRASS, sb, lf, xw, y);
          const h = ((xw * 61 + y * 103) & 255) / 255;
          if (sb.s0 === 0 && h < 0.07) gCol = (h < 0.035) ? IDX.red[3] : IDX.gold[3]; // Spring wildflowers
          if (sb.s0 === 2 && h < 0.12) gCol = (h < 0.06) ? IDX.red[2] : IDX.gold[3];  // Autumn leaves
          if (sb.s0 === 3 && h < 0.04) gCol = IDX.ink[2]; // Twigs in snow
          setPx(xw, y, gCol);
        }
      }

      // 9. Forbidden City Orange Tabby Cat (feet at row 70, follows lens center, autumn chonk, winter snow)
      const targetCatX = lerp(a, g, x);
      const prevCatX = catX;
      catX = lerp(catX, targetCatX, 1.0 - Math.exp(-6.0 * dt));
      const catMoveDelta = catX - prevCatX;

      if (Math.abs(catMoveDelta) > 0.03) {
        catDir = catMoveDelta > 0 ? 1 : -1;
        catStopTimer = 0;
      } else {
        catStopTimer += dt;
      }

      // Autumn chonkiness ("贴秋膘"): grows from Y=1.5 (0.15) to Autumn (1.0) to Winter (1.3), slims down at Lichun
      let chonk = 0.15;
      if (!isReturn) {
        if (Y >= 1.5) chonk = lerp(0.15, 1.3, clamp((Y - 1.5) / 1.5, 0, 1));
      } else {
        chonk = lerp(1.3, 0.15, clamp((Y - 3.6) / 0.4, 0, 1));
      }
      const extraW = Math.floor(chonk / 0.4);

      if (sb.s0 === 3 && catStopTimer > 0.6 && !isReturn) {
        catSnow = Math.min(1.0, catSnow + dt * 0.25);
      } else if (Math.abs(catMoveDelta) > 0.08) {
        catSnow = 0; // Shakes off snow when waking up
        if (isReturn && Y > 3.05) catScarf = true;
      }
      if (!isReturn && Y < 2.8) catScarf = false;

      const cx = Math.round(catX);
      const jumpOff = catJumpTimer > 0 ? -3 : 0;
      const feetY = 70 + jumpOff;
      const bodyW = 6 + extraW;
      const bodyLeft = cx - Math.floor(bodyW / 2);

      // Shadow under cat
      fillRect(bodyLeft, 71, bodyW, 1, IDX.ink[1]);

      const isSkating = (isReturn && Y >= 3.35 && Y <= 3.7 && Math.abs(catMoveDelta) > 0.04);
      const isSleeping = (catStopTimer > 0.6 && catJumpTimer <= 0 && !isSkating);

      if (isSleeping) {
        // Curled / loafing cat basking
        fillRect(bodyLeft, feetY - 3, bodyW + 1, 3, IDX.gold[2]);
        fillRect(bodyLeft + 1, feetY - 3, bodyW - 1, 1, IDX.gold[1]); // Back stripes
        fillRect(bodyLeft, feetY - 1, bodyW + 1, 1, IDX.paper[3]); // White belly
        if (catSnow > 0.3) fillRect(bodyLeft + 1, feetY - 4, bodyW - 1, 1, IDX.paper[3]);
      } else {
        // Walking side-profile cat
        fillRect(bodyLeft, feetY - 4, bodyW, 3, IDX.gold[2]);
        for (let sx = bodyLeft + 1; sx < bodyLeft + bodyW - 1; sx += 2) {
          setPx(sx, feetY - 4, IDX.gold[1]); // Tabby stripes
        }
        fillRect(bodyLeft + 1, feetY - 2, bodyW - 2, 1, IDX.paper[3]); // White belly

        // Head & Pink Nose
        const headX = catDir > 0 ? (bodyLeft + bodyW - 1) : (bodyLeft - 2);
        fillRect(headX, feetY - 6, 3, 3, IDX.gold[2]);
        setPx(headX, feetY - 7, IDX.gold[1]); // Ears
        setPx(headX + 2, feetY - 7, IDX.gold[1]);
        setPx(catDir > 0 ? headX + 2 : headX, feetY - 5, IDX.red[3]); // Pink nose
        if (catScarf) fillRect(headX, feetY - 3, 3, 1, IDX.red[2]); // Red scarf

        // Raised wagging tail
        const tailX = catDir > 0 ? (bodyLeft - 1) : (bodyLeft + bodyW);
        const wag = Math.round(Math.sin(simTime * 6) * 1);
        setPx(tailX, feetY - 5, IDX.gold[2]);
        setPx(tailX - catDir, feetY - 6 + wag, IDX.gold[1]);

        // Legs (or splayed ice-sliding legs!)
        if (isSkating) {
          setPx(bodyLeft - 1, feetY, IDX.paper[3]);
          setPx(bodyLeft + bodyW, feetY, IDX.paper[3]);
        } else {
          const stride = Math.floor(simTime * 10) % 2;
          setPx(bodyLeft + 1 + stride, feetY - 1, IDX.paper[3]);
          setPx(bodyLeft + bodyW - 2 - stride, feetY - 1, IDX.paper[3]);
        }

        // Startled puff-up spikes if dragged too fast
        if (catJumpTimer > 0 && !reducedMotion) {
          for (let px = bodyLeft - 1; px <= bodyLeft + bodyW; px += 2) {
            setPx(px, feetY - 6, IDX.gold[3]);
          }
        }
      }

      // 10. Seasonal Weather Particles & Birds (Rewind reverses motion!)
      const rewindSign = ((dragging && (( !isReturn && v < -0.02 ) || ( isReturn && v > 0.02 ))) ? -1 : 1);
      if (!reducedMotion) {
        if (sb.s0 === 0 || (isReturn && Y > 3.7)) {
          // Spring willow catkins + swifts flying from left (fleeing when startled)
          for (const wf of willowFluff) {
            wf.x = (wf.x + dt * 6 * rewindSign + coreW) % coreW;
            setPx(Math.round(wf.x), Math.round(wf.y + Math.sin(simTime * 2 + wf.ph) * 2), IDX.paper[3]);
          }
          const swiftBaseX = (a - 35 + simTime * 14 * rewindSign + coreW) % coreW;
          const fleeY = birdsStartled > 0 ? -12 : 0;
          for (let b = 0; b < 3; b++) {
            const bx = Math.round((swiftBaseX + b * 7) % coreW);
            const by = 18 + b * 3 + fleeY;
            setPx(bx, by, IDX.ink[0]);
            setPx(bx - 1, by - 1, IDX.ink[0]);
            setPx(bx + 1, by - 1, IDX.ink[0]);
          }
        } else if (sb.s0 === 2) {
          // Swirling ginkgo leaves + circling pigeons with whistle arcs around Temple of Heaven
          for (const glf of ginkgoLeaves) {
            glf.y = (glf.y + dt * 7 * rewindSign + 68) % 68;
            const gx = Math.round(glf.x + Math.sin(simTime * 3 + glf.ph) * 4);
            setPx(gx, Math.round(glf.y), IDX.gold[3]);
          }
          const fleeR = birdsStartled > 0 ? 18 : 0;
          for (let p = 0; p < 5; p++) {
            const ang = simTime * 1.6 * rewindSign + p * 1.25;
            const px = Math.round(t + Math.cos(ang) * (18 + fleeR));
            const py = Math.round(16 + Math.sin(ang) * 4 - fleeR * 0.5);
            setPx(px, py, IDX.paper[3]);
            setPx(px - 2, py + 1, IDX.paper[1]); // Whistle arc
          }
        } else if (sb.s0 === 3 && winterStaySec <= 18) {
          // Two-layer heavy winter snow
          for (const sf of snowFlakes) {
            const spd = sf.layer === 0 ? 11 : 17;
            sf.y = (sf.y + dt * spd * rewindSign + 72) % 72;
            const sx = Math.round((sf.x + Math.sin(simTime * 2 + sf.y * 0.1) * 2 + coreW) % coreW);
            setPx(sx, Math.round(sf.y), sf.layer === 0 ? IDX.paper[2] : IDX.paper[3]);
          }
        }
      }

      // VHS Rewind scanline shift every 6 rows when dragging backward with |v| > 0.05
      const isRewinding = (rewindSign < 0 && Math.abs(v) > 0.05 && !reducedMotion);
      for (let y = 0; y < fullH; y++) {
        const shift = (isRewinding && (y % 6 === 0)) ? 1 : 0;
        for (let xw = 0; xw < fullW; xw++) {
          const srcX = clamp(xw - shift, 0, fullW - 1);
          const rgb = PAL[idxBuf[y * fullW + srcX]];
          const o = (y * fullW + xw) * 4;
          rgbaBuf[o] = rgb[0];
          rgbaBuf[o + 1] = rgb[1];
          rgbaBuf[o + 2] = rgb[2];
          rgbaBuf[o + 3] = 255;
        }
      }

      updateSurfaceTexture(Y, dt);
      buildLightField(emitGrid, 144, 44, lightRgba);
      return { nightAmt, flash, isRewinding, sb };
    }

    function snapToNearestStop(customTarget) {
      const stop = customTarget !== undefined
        ? clamp(customTarget, 0, 3)
        : Math.round(clamp(x + clamp(v, -3, 3) * 0.09, 0, 1) * 3);
      targetX = stop / 3.0;

      if (stop !== prevStopIdx) {
        // Bounce bigger at endpoints (0, 3), smaller at middle stops (1, 2)
        if (!reducedMotion) {
          bounceVel = (stop === 0 || stop === 3) ? (stop > prevStopIdx ? 4.5 : -4.5) : (stop > prevStopIdx ? 2.2 : -2.2);
        }
        sealStampOffset = 1;
        sealFadeFrames = 4;
        prevStopIdx = stop;

        if (!isReturn && stop === 3) {
          // Reached Winter -> next leftward drag enters return path
        } else if (isReturn && stop === 0) {
          // Reached Lichun -> back to forward path, new year begins
          isReturn = false;
        }

        const label = isReturn ? STOP_LABELS_RET[stop] : STOP_LABELS_OUT[stop];
        slider.setAttribute('aria-valuenow', String(stop));
        slider.setAttribute('aria-valuetext', label);
        announce(label);
        drawSeal(stop);
        slider.dispatchEvent(new Event('change', { bubbles: true }));
      }
    }

    slider.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      slider.setPointerCapture(e.pointerId);
      dragging = true;
      pointerStartX = e.clientX;
      dragStartVal = x;
    });

    slider.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const rect = slider.getBoundingClientRect();
      const travel = Math.max(20, rect.width - rect.height);
      const dx = (e.clientX - pointerStartX) / travel;
      if (!isReturn && x >= 0.98 && dx < -0.02) isReturn = true;
      targetX = clamp(dragStartVal + dx, 0, 1);

      const curStop = Math.round(targetX * 3);
      if (curStop !== prevStopIdx) {
        slider.dispatchEvent(new Event('input', { bubbles: true }));
      }
    });

    slider.addEventListener('pointerup', (e) => {
      if (!dragging) return;
      dragging = false;
      const movedPx = Math.abs(e.clientX - pointerStartX);
      if (movedPx < 4) {
        const rect = slider.getBoundingClientRect();
        const clickNorm = clamp((e.clientX - rect.left - rect.height * 0.5) / Math.max(1, rect.width - rect.height), 0, 1);
        const curStop = Math.round(x * 3);
        const lensCenterPx = rect.left + rect.height * 0.5 + x * (rect.width - rect.height);
        if (Math.abs(e.clientX - lensCenterPx) <= rect.height * 0.5) {
          // Clicked on lens: advance one stop (after winter enters return)
          if (!isReturn && curStop === 3) {
            isReturn = true;
            snapToNearestStop(2);
          } else if (isReturn && curStop > 0) {
            snapToNearestStop(curStop - 1);
          } else {
            snapToNearestStop(Math.min(3, curStop + 1));
          }
        } else {
          // Clicked on track: snap to closest stop
          const clickedStop = Math.round(clickNorm * 3);
          if (!isReturn && curStop === 3 && clickedStop < 3) isReturn = true;
          snapToNearestStop(clickedStop);
        }
      } else {
        snapToNearestStop();
      }
    });

    slider.addEventListener('keydown', (e) => {
      const curStop = Math.round(targetX * 3);
      if (e.key === 'ArrowRight') {
        e.preventDefault();
        if (!isReturn && curStop === 3) {
          isReturn = true;
          snapToNearestStop(2);
        } else {
          snapToNearestStop(Math.min(3, curStop + 1));
        }
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        if (!isReturn && curStop === 3) isReturn = true;
        snapToNearestStop(Math.max(0, curStop - 1));
      } else if (e.key === 'Home') {
        e.preventDefault();
        isReturn = false;
        snapToNearestStop(0);
      } else if (e.key === 'End') {
        e.preventDefault();
        isReturn = false;
        snapToNearestStop(3);
      }
    });

    function stepPhysics(dt) {
      const prevX = x;
      if (dragging) {
        x = lerp(x, targetX, 1.0 - Math.exp(-34 * dt));
        v = (x - prevX) / Math.max(dt, 1e-4);
        if (Math.abs(v) > 3.4 && fastDragCd <= 0 && !reducedMotion) {
          fastDragCd = 1.5;
          catJumpTimer = 0.55;
          birdsStartled = 1.4;
        }
      } else {
        const omega = reducedMotion ? 16.0 : 9.5;
        const disp = x - targetX;
        const acc = -2 * omega * v - omega * omega * disp;
        v += acc * dt;
        x += v * dt;
        if (Math.abs(disp) < 0.0005 && Math.abs(v) < 0.005) {
          x = targetX; v = 0;
        }
      }

      pressAmt = lerp(pressAmt, dragging ? 1 : 0, 1.0 - Math.exp(-14 * dt));
      if (!reducedMotion) {
        const targetS = Math.abs(v) * 0.42;
        const sAcc = 170 * (targetS - stretchS) - 11 * stretchV;
        stretchV += sAcc * dt;
        stretchS += stretchV * dt;
        stretchS = clamp(stretchS, 0, 0.45);

        bounceOffset += bounceVel * dt;
        bounceVel += (-180 * bounceOffset - 16 * bounceVel) * dt;
      } else {
        stretchS = 0; bounceOffset = 0;
      }
      if (sealStampOffset > 0) sealStampOffset = Math.max(0, sealStampOffset - dt * 6);
    }

    drawSeal(0);

    function drawFrame(dt) {
      stepPhysics(dt);

      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const rect = wrap.getBoundingClientRect();
      const cw = Math.max(10, Math.round(rect.width * dpr));
      const ch = Math.max(10, Math.round(rect.height * dpr));

      if (glCanvas.width !== cw || glCanvas.height !== ch) {
        glCanvas.width = cw; glCanvas.height = ch;
        fbCanvas.width = cw; fbCanvas.height = ch;
      }

      // Capsule width = compW * 0.90, aspect 4.0, centered in component
      const capW = cw * 0.90;
      const capH = capW / 4.0;
      const shellThick = capH * 0.046;
      const winH = capH - shellThick * 2;
      const winW = capW - shellThick * 2;

      // Integer scale k: floor(winH/96), or k+1 if cropped <= 12%
      let k = Math.max(1, Math.floor(winH / CORE_H));
      if (((k + 1) * CORE_H - winH) / ((k + 1) * CORE_H) <= 0.12) {
        k = k + 1;
      }

      const neededCoreW = Math.max(160, Math.ceil(winW / k));
      if (neededCoreW !== coreW) {
        coreW = neededCoreW;
        fullW = coreW + PAD * 2;
        idxBuf = new Uint8Array(fullW * fullH);
        rgbaBuf = new Uint8Array(fullW * fullH * 4);
      }

      // 4 stop centers C[i] = (winH/2 + i * travel/3) / k
      const lensTravel = winW - winH;
      const centers = [0, 1, 2, 3].map(i => Math.round((winH * 0.5 + (i * lensTravel) / 3.0) / k));

      const { nightAmt, flash, isRewinding, sb } = renderWorld(dt, centers);

      // Position 15x51 pixelated red seal at right outer end of capsule, bottom-aligned
      const capRightCss = (rect.width + (capW / dpr)) * 0.5;
      const capBottomCss = (rect.height + (capH / dpr)) * 0.5;
      const kCss = k / dpr;
      sealCanvas.style.width = `${Math.round(15 * kCss)}px`;
      sealCanvas.style.height = `${Math.round(51 * kCss)}px`;
      sealCanvas.style.left = `${Math.round(capRightCss + 4)}px`;
      sealCanvas.style.top = `${Math.round(capBottomCss - 51 * kCss + sealStampOffset * kCss)}px`;
      sealCanvas.style.filter = nightAmt > 0.2 ? `brightness(${(1.0 - nightAmt * 0.45).toFixed(2)})` : 'none';

      const lensRad = (winH * 0.5 - capH * 0.032) * (1.0 + pressAmt * 0.012);
      const lensX = (cw * 0.5 - lensTravel * 0.5) + x * lensTravel + bounceOffset;

      if (!comp) {
        glCanvas.style.display = 'none';
        fbCanvas.style.display = 'block';
        const ctx = fbCanvas.getContext('2d');
        ctx.clearRect(0, 0, cw, ch);
        ctx.save();
        roundRectPath(ctx, (cw - capW)*0.5, (ch - capH)*0.5, capW, capH, capH * 0.5);
        ctx.clip();
        if (fallbackBitmap.width !== fullW || fallbackBitmap.height !== fullH) {
          fallbackBitmap.width = fullW; fallbackBitmap.height = fullH;
          fallbackImageData = new ImageData(new Uint8ClampedArray(rgbaBuf), fullW, fullH);
        } else {
          fallbackImageData.data.set(rgbaBuf);
        }
        fallbackBitmapCtx.putImageData(fallbackImageData, 0, 0);
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(fallbackBitmap, (cw - winW)*0.5 - PAD*k, (ch - CORE_H*k)*0.5 - PAD*k, fullW*k, fullH*k);
        ctx.fillStyle = 'rgba(255,255,255,0.28)';
        ctx.beginPath();
        ctx.arc(lensX, ch * 0.5, lensRad, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        return;
      }

      const { gl, prog, vao, worldTex, lightTex, surfTex, locs } = comp;
      gl.viewport(0, 0, cw, ch);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

      gl.useProgram(prog);
      gl.bindVertexArray(vao);

      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, worldTex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, fullW, fullH, 0, gl.RGBA, gl.UNSIGNED_BYTE, rgbaBuf);
      gl.uniform1i(locs.uWorldTex, 0);

      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, lightTex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 144, 44, 0, gl.RGBA, gl.UNSIGNED_BYTE, lightRgba);
      gl.uniform1i(locs.uLightTex, 1);

      gl.activeTexture(gl.TEXTURE2);
      gl.bindTexture(gl.TEXTURE_2D, surfTex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 48, 48, 0, gl.RGBA, gl.UNSIGNED_BYTE, surfRgba);
      gl.uniform1i(locs.uSurfTex, 2);

      gl.uniform1f(locs.uHasSurf, 1.0);
      gl.uniform2f(locs.uCompSize, cw, ch);
      gl.uniform2f(locs.uCapCenter, cw * 0.5, ch * 0.5);
      gl.uniform2f(locs.uCapSize, capW, capH);
      gl.uniform1f(locs.uShellThick, shellThick);
      gl.uniform1f(locs.uLensX, lensX);
      gl.uniform1f(locs.uLensRad, lensRad);
      gl.uniform2f(locs.uLensStretch, 1.0 + 0.2 * stretchS, 1.0 - 0.075 * stretchS);
      gl.uniform1f(locs.uPress, pressAmt);
      gl.uniform1f(locs.uDispersion, isRewinding ? 0.075 : 0.05);
      gl.uniform1f(locs.uNight, nightAmt);

      const dayShell = PAL[IDX.paper[3]];
      const nightShell = PAL[IDX.ink[1]];
      gl.uniform3f(locs.uShellDayCol, dayShell[0]/255, dayShell[1]/255, dayShell[2]/255);
      gl.uniform3f(locs.uShellNightCol, nightShell[0]/255, nightShell[1]/255, nightShell[2]/255);

      const isWinterLanterns = (sb.s0 === 3);
      gl.uniform3f(locs.uWarmGlowCol, isWinterLanterns ? 0.96 : 1.0, isWinterLanterns ? 0.36 : 0.76, isWinterLanterns ? 0.22 : 0.34);
      gl.uniform1f(locs.uWarmGlowAmt, 0.85);
      gl.uniform2f(locs.uWarmCentroid, isWinterLanterns ? 0.85 : (0.15 + x * 0.55), 0.55);
      gl.uniform1f(locs.uFlash, flash);
      gl.uniform1f(locs.uK, k);
      gl.uniform2f(locs.uWinTopLeft, (cw - winW) * 0.5, (ch - CORE_H * k) * 0.5);
      gl.uniform2f(locs.uWinSize, winW, CORE_H * k);
      gl.uniform2f(locs.uPad, PAD, PAD);
      gl.uniform2f(locs.uWorldTexSize, fullW, fullH);
      gl.uniform1f(locs.uTime, simTime);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }

    return { drawFrame, getNight: () => {
      const Y = getAnnualY();
      if (Y >= 2.75 && Y <= 3.35) {
        return 0.85 * smoothstep(2.75, 2.98, Y) * (1.0 - smoothstep(3.15, 3.45, Y));
      }
      return 0;
    }};
  })();

  // =========================================================================
  // SCENE 3: LIGHT & DARK MORPHING DOT-MATRIX SWITCH
  // =========================================================================
  const LightDarkApp = (() => {
    const canvas = document.getElementById('ldCanvas');
    const ctx = canvas.getContext('2d');
    const btn = document.getElementById('ldBtn');

    // Support URL param ?t=0..1
    const urlT = parseFloat(new URLSearchParams(window.location.search).get('t'));
    let t = !Number.isNaN(urlT) ? clamp(urlT, 0, 1) : 0;
    let v = 0;
    let targetT = t >= 0.5 ? 1 : 0;
    if (!Number.isNaN(urlT)) targetT = t;
    let dragging = false;
    let pointerStartX = 0;
    let dragStartT = t;
    let simTime = 0;

    // Multi-stop OKLab color ramps (Night -> Day)
    const STOPS = {
      bg:      ['#0E1016', '#3A3C44', '#8D8E93', '#E7E5E1'],
      track:   ['#06070B', '#2A2C33', '#7E8086', '#E2DFDA'],
      rim:     ['#8E9BFF', '#C9C4FF', '#FFFFFF', '#FFE2B0', '#FFB140'],
      dots:    ['#F4F6FF', '#E9ECF7', '#B9B3AA', '#5A4632'],
      knobTop: ['#3A3E4E', '#7A7E8E', '#C8C8CE', '#FFFFFF'],
      knobBot: ['#20222C', '#585B68', '#A8A8AE', '#F2EFEA']
    };

    function sampleRamp(rampHex, u) {
      const scaled = clamp(u, 0, 1) * (rampHex.length - 1);
      const i0 = Math.floor(scaled);
      const i1 = Math.min(rampHex.length - 1, i0 + 1);
      return mixOklabHex(rampHex[i0], rampHex[i1], scaled - i0);
    }

    function sampleRampRgb(rampHex, u) {
      const scaled = clamp(u, 0, 1) * (rampHex.length - 1);
      const i0 = Math.floor(scaled);
      const i1 = Math.min(rampHex.length - 1, i0 + 1);
      const c1 = rgbToOklab(...hexToRgb01(rampHex[i0]));
      const c2 = rgbToOklab(...hexToRgb01(rampHex[i1]));
      const f = scaled - i0;
      const rgb = oklabGamutSrgb(lerp(c1[0], c2[0], f), lerp(c1[1], c2[1], f), lerp(c1[2], c2[2], f));
      return [Math.round(rgb[0]*255), Math.round(rgb[1]*255), Math.round(rgb[2]*255)];
    }

    // Build 15x15 Moon & Sun dot sets paired by angle around center (7,7)
    const moonDots = [];
    const darkMoonDots = [];
    const starDots = [
      { gx: 12.5, gy: 1.5, baseA: 1.0, phase: 0.0 },
      { gx: 11.5, gy: 1.5, baseA: 0.6, phase: 1.2 },
      { gx: 13.5, gy: 1.5, baseA: 0.6, phase: 2.4 },
      { gx: 12.5, gy: 0.5, baseA: 0.6, phase: 3.6 },
      { gx: 12.5, gy: 2.5, baseA: 0.6, phase: 4.8 }
    ];

    for (let gy = 0; gy < 15; gy++) {
      for (let gx = 0; gx < 15; gx++) {
        const dMain = Math.hypot(gx - 6.6, gy - 7.4);
        const dCut = Math.hypot(gx - 9.2, gy - 5.0);
        if (dMain <= 5.6) {
          if (dCut > 4.9) {
            moonDots.push({ gx, gy, ang: Math.atan2(gy - 7, gx - 7) });
          } else {
            darkMoonDots.push({ gx, gy });
          }
        }
      }
    }

    const sunDots = [];
    for (let gy = 0; gy < 15; gy++) {
      for (let gx = 0; gx < 15; gx++) {
        if (Math.hypot(gx - 7, gy - 7) <= 3.3) {
          sunDots.push({ gx, gy, ang: Math.atan2(gy - 7, gx - 7) });
        }
      }
    }
    // 8 Sun Rays: 4 cardinal (2 dots each from r=4.9) + 4 diagonal (1 dot each at r=4.6)
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx, dy]) => {
      [4.9, 6.1].forEach(r => {
        const gx = 7 + dx * r, gy = 7 + dy * r;
        sunDots.push({ gx, gy, ang: Math.atan2(gy - 7, gx - 7) });
      });
    });
    const invSqrt2 = 1 / Math.SQRT2;
    [[1,1],[-1,1],[1,-1],[-1,-1]].forEach(([dx, dy]) => {
      const gx = 7 + dx * 4.6 * invSqrt2, gy = 7 + dy * 4.6 * invSqrt2;
      sunDots.push({ gx, gy, ang: Math.atan2(gy - 7, gx - 7) });
    });

    moonDots.sort((a, b) => a.ang - b.ang);
    sunDots.sort((a, b) => a.ang - b.ang);

    const maxDots = Math.max(moonDots.length, sunDots.length);
    const pairedParticles = [];
    for (let i = 0; i < maxDots; i++) {
      const mIdx = Math.floor((i / maxDots) * moonDots.length);
      const sIdx = Math.floor((i / maxDots) * sunDots.length);
      const m = moonDots[mIdx];
      const s = sunDots[sIdx];
      const h1 = ((i * 73 + 19) & 255) / 255;
      const h2 = ((i * 137 + 41) & 255) / 255;
      pairedParticles.push({
        mx: m.gx, my: m.gy,
        sx: s.gx, sy: s.gy,
        delay: h1 * 0.25,
        rotScale: 0.6 + h2 * 0.8,
        jitterX: (h1 - 0.5) * 4.4,
        jitterY: (h2 - 0.5) * 4.4,
        fadeMode: i >= moonDots.length ? 'in' : (i >= sunDots.length ? 'out' : 'both')
      });
    }

    // Perimeter point helper for rounded rectangle (clockwise from top-center u=0..1)
    function getRoundedRectPoint(x, y, w, h, r, u) {
      u = ((u % 1) + 1) % 1;
      const straightW = w - 2 * r;
      const straightH = h - 2 * r;
      const arcLen = 0.5 * Math.PI * r;
      const perim = 2 * straightW + 2 * straightH + 4 * arcLen;
      let d = u * perim;

      // 1. Top-right half
      if (d < straightW * 0.5) return [x + w * 0.5 + d, y];
      d -= straightW * 0.5;
      // 2. Top-right corner
      if (d < arcLen) {
        const a = -Math.PI * 0.5 + (d / arcLen) * (Math.PI * 0.5);
        return [x + w - r + Math.cos(a) * r, y + r + Math.sin(a) * r];
      }
      d -= arcLen;
      // 3. Right edge
      if (d < straightH) return [x + w, y + r + d];
      d -= straightH;
      // 4. Bottom-right corner
      if (d < arcLen) {
        const a = (d / arcLen) * (Math.PI * 0.5);
        return [x + w - r + Math.cos(a) * r, y + h - r + Math.sin(a) * r];
      }
      d -= arcLen;
      // 5. Bottom edge
      if (d < straightW) return [x + w - r - d, y + h];
      d -= straightW;
      // 6. Bottom-left corner
      if (d < arcLen) {
        const a = Math.PI * 0.5 + (d / arcLen) * (Math.PI * 0.5);
        return [x + r + Math.cos(a) * r, y + h - r + Math.sin(a) * r];
      }
      d -= arcLen;
      // 7. Left edge
      if (d < straightH) return [x, y + h - r - d];
      d -= straightH;
      // 8. Top-left corner
      if (d < arcLen) {
        const a = Math.PI + (d / arcLen) * (Math.PI * 0.5);
        return [x + r + Math.cos(a) * r, y + r + Math.sin(a) * r];
      }
      d -= arcLen;
      // 9. Top-left half
      return [x + r + d, y];
    }

    function toggleState(forceVal) {
      targetT = forceVal !== undefined ? forceVal : (targetT < 0.5 ? 1 : 0);
      btn.setAttribute('aria-checked', targetT === 1 ? 'true' : 'false');
      announce(targetT === 1 ? '浅色' : '深色');
      btn.dispatchEvent(new Event('change', { bubbles: true }));
    }

    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      btn.setPointerCapture(e.pointerId);
      dragging = true;
      pointerStartX = e.clientX;
      dragStartT = t;
    });

    btn.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dx = (e.clientX - pointerStartX) / 156;
      const previousT = t;
      t = clamp(dragStartT + dx, 0, 1);
      v = (t - previousT) * 60;
    });

    btn.addEventListener('pointerup', (e) => {
      if (!dragging) return;
      dragging = false;
      if (Math.abs(e.clientX - pointerStartX) < 4) {
        toggleState();
      } else {
        const dest = (t + clamp(v, -3, 3) * 0.06 >= 0.5) ? 1 : 0;
        toggleState(dest);
      }
    });

    btn.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        toggleState();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        toggleState(1);
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        toggleState(0);
      }
    });

    function drawFrame(dt) {
      simTime += dt;
      if (!dragging) {
        const omega = reducedMotion ? 30.0 : 10.0;
        const disp = t - targetT;
        const acc = -2 * omega * v - omega * omega * disp;
        v += acc * dt;
        t += v * dt;
        if (Math.abs(disp) < 0.0004 && Math.abs(v) < 0.004) {
          t = targetT; v = 0;
        }
      }

      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      if (canvas.width !== 440 * dpr || canvas.height !== 280 * dpr) {
        canvas.width = 440 * dpr;
        canvas.height = 280 * dpr;
      }

      const bgCss = sampleRamp(STOPS.bg, t);
      stage.style.backgroundColor = bgCss;
      stage.style.setProperty('--night', (1.0 - t).toFixed(3));

      ctx.save();
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, 440, 280);

      const tx = 60, ty = 58, tw = 320, th = 164, tr = 58;
      const knobSize = 140, knobR = 46, travel = 156;
      const kx = tx + 12 + t * travel;
      const ky = ty + 12;

      const rimRgb = sampleRampRgb(STOPS.rim, t);
      const rimCss = `rgb(${rimRgb[0]}, ${rimRgb[1]}, ${rimRgb[2]})`;

      // 1. Track Outer Drop Shadow
      ctx.save();
      ctx.shadowColor = `rgba(0, 0, 0, ${lerp(0.55, 0.12, t).toFixed(2)})`;
      ctx.shadowBlur = 26;
      ctx.shadowOffsetY = 10;
      ctx.fillStyle = sampleRamp(STOPS.track, t);
      roundRectPath(ctx, tx, ty, tw, th, tr);
      ctx.fill();
      ctx.restore();

      // 2. Track Recessed Inner Shadow & Rim Light Bounce on Track Floor
      ctx.save();
      roundRectPath(ctx, tx, ty, tw, th, tr);
      ctx.clip();

      // Rim light reflection on track floor (bottom-left at night -> top-right at day)
      const bounceX = lerp(kx + 24, kx + knobSize - 24, t);
      const bounceY = lerp(ky + knobSize - 16, ky + 16, t);
      const bounceGrad = ctx.createRadialGradient(bounceX, bounceY, 4, bounceX, bounceY, 95);
      bounceGrad.addColorStop(0, `rgba(${rimRgb[0]}, ${rimRgb[1]}, ${rimRgb[2]}, ${lerp(0.45, 0.35, t).toFixed(2)})`);
      bounceGrad.addColorStop(1, `rgba(${rimRgb[0]}, ${rimRgb[1]}, ${rimRgb[2]}, 0)`);
      ctx.fillStyle = bounceGrad;
      ctx.fillRect(tx, ty, tw, th);

      // Thick inner shadow stroke
      ctx.strokeStyle = `rgba(0, 0, 0, ${lerp(0.85, 0.22, t).toFixed(2)})`;
      ctx.lineWidth = 10;
      ctx.shadowColor = `rgba(0, 0, 0, ${lerp(0.85, 0.22, t).toFixed(2)})`;
      ctx.shadowBlur = 12;
      ctx.shadowOffsetY = 3;
      roundRectPath(ctx, tx - 3, ty - 3, tw + 6, th + 6, tr + 2);
      ctx.stroke();
      ctx.restore();

      // Track 1px crisp highlight edge
      ctx.strokeStyle = `rgba(255, 255, 255, ${lerp(0.06, 0.55, t).toFixed(2)})`;
      ctx.lineWidth = 1;
      roundRectPath(ctx, tx + 0.5, ty + 0.5, tw - 1, th - 1, tr);
      ctx.stroke();

      // 3. Frosted Glass Knob
      ctx.save();
      ctx.shadowColor = `rgba(0, 0, 0, ${lerp(0.55, 0.16, t).toFixed(2)})`;
      ctx.shadowBlur = 18;
      ctx.shadowOffsetY = 6;
      const knobGrad = ctx.createLinearGradient(0, ky, 0, ky + knobSize);
      knobGrad.addColorStop(0, sampleRamp(STOPS.knobTop, t));
      knobGrad.addColorStop(1, sampleRamp(STOPS.knobBot, t));
      ctx.fillStyle = knobGrad;
      roundRectPath(ctx, kx, ky, knobSize, knobSize, knobR);
      ctx.fill();
      ctx.restore();

      // Knob interior tinted rim glow + upper white sheen
      ctx.save();
      roundRectPath(ctx, kx, ky, knobSize, knobSize, knobR);
      ctx.clip();

      const innerGlowX = lerp(kx + 22, kx + knobSize - 22, t);
      const innerGlowY = lerp(ky + knobSize - 22, ky + 22, t);
      const innerGlow = ctx.createRadialGradient(innerGlowX, innerGlowY, 2, innerGlowX, innerGlowY, 82);
      innerGlow.addColorStop(0, `rgba(${rimRgb[0]}, ${rimRgb[1]}, ${rimRgb[2]}, 0.34)`);
      innerGlow.addColorStop(1, `rgba(${rimRgb[0]}, ${rimRgb[1]}, ${rimRgb[2]}, 0)`);
      ctx.fillStyle = innerGlow;
      ctx.fillRect(kx, ky, knobSize, knobSize);

      const sheenGrad = ctx.createLinearGradient(0, ky, 0, ky + knobSize * 0.55);
      sheenGrad.addColorStop(0, `rgba(255, 255, 255, ${lerp(0.10, 0.65, t).toFixed(2)})`);
      sheenGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = sheenGrad;
      ctx.fillRect(kx, ky, knobSize, knobSize * 0.55);
      ctx.restore();

      // Knob 1px specular border
      ctx.strokeStyle = `rgba(255, 255, 255, ${lerp(0.14, 0.90, t).toFixed(2)})`;
      ctx.lineWidth = 1;
      roundRectPath(ctx, kx + 0.5, ky + 0.5, knobSize - 1, knobSize - 1, knobR);
      ctx.stroke();

      // 4. Traveling Gaussian Edge Rim Light (u0 = 0.60 + 0.53 * ease(t))
      const easeT = smoothstep(0, 1, t);
      const u0 = 0.60 + 0.53 * easeT;
      const halfSpan = lerp(0.22, 0.19, t);
      const segs = 90;

      ctx.save();
      if (t < 0.6) ctx.globalCompositeOperation = 'lighter';
      ctx.lineCap = 'round';

      for (let pass = 0; pass < 2; pass++) {
        for (let s = 0; s < segs; s++) {
          const fNorm = -1 + (2 * (s + 0.5)) / segs; // -1..1
          const gauss = Math.exp(-2.6 * fNorm * fNorm);
          if (gauss < 0.03) continue;

          const uA = u0 + (-1 + (2 * s) / segs) * halfSpan;
          const uB = u0 + (-1 + (2 * (s + 1)) / segs) * halfSpan;
          const pA = getRoundedRectPoint(kx - 1.5, ky - 1.5, knobSize + 3, knobSize + 3, knobR + 1.5, uA);
          const pB = getRoundedRectPoint(kx - 1.5, ky - 1.5, knobSize + 3, knobSize + 3, knobR + 1.5, uB);

          ctx.beginPath();
          ctx.moveTo(pA[0], pA[1]);
          ctx.lineTo(pB[0], pB[1]);

          if (pass === 0) {
            ctx.strokeStyle = rimCss;
            ctx.globalAlpha = gauss * 0.85;
            ctx.lineWidth = 4.2;
            ctx.shadowColor = rimCss;
            ctx.shadowBlur = 26;
          } else {
            ctx.strokeStyle = '#ffffff';
            ctx.globalAlpha = gauss * lerp(0.90, 0.55, t);
            ctx.lineWidth = 2.2;
            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 8;
          }
          ctx.stroke();
        }
      }
      ctx.restore();

      // 5. 15x15 Dot-Matrix Moon <-> Sun Morphing Particles
      const gridStep = 5.6;
      const dotSize = 4.3;
      const gridOriginX = kx + knobSize * 0.5 - 7 * gridStep;
      const gridOriginY = ky + knobSize * 0.5 - 7 * gridStep;
      const dotRgb = sampleRampRgb(STOPS.dots, t);

      ctx.save();
      if (t < 0.6) {
        ctx.shadowColor = 'rgba(225, 235, 255, 0.75)';
        ctx.shadowBlur = 5 * (1.0 - t / 0.6);
      }

      // Faint dark moon interior dots (fade out as t increases)
      if (t < 0.45) {
        const darkAlpha = 0.16 * (1.0 - t / 0.45);
        ctx.fillStyle = `rgba(${dotRgb[0]}, ${dotRgb[1]}, ${dotRgb[2]}, ${darkAlpha.toFixed(3)})`;
        for (const dm of darkMoonDots) {
          ctx.fillRect(
            gridOriginX + dm.gx * gridStep - dotSize * 0.5,
            gridOriginY + dm.gy * gridStep - dotSize * 0.5,
            dotSize, dotSize
          );
        }

        // Twinkling cross star at (12.5, 1.5)
        for (const st of starDots) {
          const twinkle = reducedMotion ? 1.0 : (0.72 + 0.28 * Math.sin(simTime * 3.5 + st.phase));
          const sa = st.baseA * twinkle * (1.0 - t / 0.45);
          ctx.fillStyle = `rgba(${dotRgb[0]}, ${dotRgb[1]}, ${dotRgb[2]}, ${sa.toFixed(3)})`;
          ctx.fillRect(
            gridOriginX + st.gx * gridStep - dotSize * 0.5,
            gridOriginY + st.gy * gridStep - dotSize * 0.5,
            dotSize, dotSize
          );
        }
      }

      // Morphing particles
      const sinPiT = Math.sin(Math.PI * t);
      for (const p of pairedParticles) {
        const localT = clamp((t - p.delay) / (1.0 - p.delay), 0, 1);
        const smoothP = smoothstep(0, 1, localT);

        let gx = lerp(p.mx, p.sx, smoothP);
        let gy = lerp(p.my, p.sy, smoothP);

        // Rotational swirl + random offset at mid-transition
        const ang = sinPiT * 1.1 * p.rotScale;
        const dx = gx - 7, dy = gy - 7;
        gx = 7 + dx * Math.cos(ang) - dy * Math.sin(ang) + sinPiT * p.jitterX;
        gy = 7 + dx * Math.sin(ang) + dy * Math.cos(ang) + sinPiT * p.jitterY;

        let alpha = 1.0;
        if (p.fadeMode === 'in') alpha = smoothP;
        else if (p.fadeMode === 'out') alpha = 1.0 - smoothP;

        const scale = 1.0 - 0.15 * sinPiT;
        const sz = dotSize * scale;

        ctx.fillStyle = `rgba(${dotRgb[0]}, ${dotRgb[1]}, ${dotRgb[2]}, ${alpha.toFixed(3)})`;
        ctx.fillRect(
          gridOriginX + gx * gridStep - sz * 0.5,
          gridOriginY + gy * gridStep - sz * 0.5,
          sz, sz
        );
      }

      ctx.restore();
      ctx.restore();
    }

    return { drawFrame, getNight: () => 1.0 - t };
  })();

  // =========================================================================
  // Tab Switching, Visibility Pause & Unified Render Loop
  // =========================================================================
  let activeTab = 'lujiazui';
  const navBar = document.getElementById('navBar');
  const panels = {
    lujiazui: document.getElementById('panel-lujiazui'),
    beijing: document.getElementById('panel-beijing'),
    lightdark: document.getElementById('panel-lightdark')
  };

  document.querySelectorAll('.nav-pill[data-tab]').forEach(pill => {
    pill.addEventListener('click', () => {
      activeTab = pill.dataset.tab;
      document.querySelectorAll('.nav-pill[data-tab]').forEach(p => p.classList.toggle('active', p === pill));
      Object.entries(panels).forEach(([k, el]) => el.classList.toggle('active', k === activeTab));
    });
  });

  document.getElementById('hideNavBtn').addEventListener('click', () => {
    navBar.classList.add('hidden');
  });
  window.addEventListener('keydown', (e) => {
    if (e.key === 'h' || e.key === 'H') {
      navBar.classList.toggle('hidden');
    }
  });

  let paused = false;
  document.addEventListener('visibilitychange', () => {
    paused = document.hidden;
  });

  let lastNow = performance.now();
  function tick(now) {
    const dt = Math.min((now - lastNow) * 0.001, 0.05);
    lastNow = now;

    if (!paused) {
      if (activeTab === 'lujiazui') LujiazuiApp.drawFrame(dt);
      else if (activeTab === 'beijing') BeijingApp.drawFrame(dt);
      else LightDarkApp.drawFrame(dt);
    }

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
